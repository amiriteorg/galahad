<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>Galahad</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      :root {
        --bg: #f7f6fb;
        --surface: #ffffff;
        --surface-2: #f0eef7;
        --text: #1c1830;
        --muted: #6b6685;
        --border: #e2dfee;
        --accent: #7c3aed;
        --accent-strong: #6d28d9;
        --accent-soft: #efe7ff;
        --on-accent: #ffffff;
        --danger: #b42318;
        --danger-soft: #fdecea;
        --ok: #157347;
        --ok-soft: #e6f4ec;
        --warn: #8a5a00;
        --warn-soft: #fff4dc;
        --radius: 12px;
        --shadow: 0 1px 2px rgba(28, 24, 48, 0.06), 0 4px 16px rgba(28, 24, 48, 0.05);
        --nav-h: 64px;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121019;
          --surface: #1b1826;
          --surface-2: #242033;
          --text: #ece9f7;
          --muted: #a29cbd;
          --border: #322d45;
          --accent: #a78bfa;
          --accent-strong: #c4b5fd;
          --accent-soft: #2b2342;
          --on-accent: #160f2b;
          --danger: #ff8a7a;
          --danger-soft: #3a1b1a;
          --ok: #6fd3a0;
          --ok-soft: #15301f;
          --warn: #f2c46b;
          --warn-soft: #33290f;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 var(--font);
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      a { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* ---- shell ---- */
      .shell { min-height: 100vh; display: flex; flex-direction: column; }
      .topbar {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; gap: 12px;
        padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: 0.01em; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .topbar .meta { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
      nav.tabs {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
        display: flex; justify-content: space-around;
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        background: var(--surface); border-top: 1px solid var(--border);
      }
      nav.tabs button {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
        min-width: 0; padding: 6px 2px; border: 0; border-radius: 10px; background: transparent;
        color: var(--muted); font-size: 12px; cursor: pointer;
      }
      nav.tabs button .glyph { font-size: 18px; line-height: 1; }
      nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
      @media (min-width: 900px) {
        .shell { flex-direction: row; }
        nav.tabs {
          position: sticky; top: 0; bottom: auto; height: 100vh; width: 220px; flex-direction: column; justify-content: flex-start;
          gap: 4px; padding: 20px 12px; border-top: 0; border-right: 1px solid var(--border); order: -1;
        }
        nav.tabs button { flex: 0; flex-direction: row; gap: 10px; padding: 10px 12px; font-size: 15px; justify-content: flex-start; }
        .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        main { padding-bottom: 32px; }
      }

      /* ---- building blocks ---- */
      h1 { font-size: 22px; margin: 4px 0 4px; letter-spacing: -0.01em; }
      h2 { font-size: 17px; margin: 0 0 10px; }
      p { margin: 0 0 10px; }
      .lede { color: var(--muted); margin-bottom: 16px; }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 16px; margin: 0 0 14px; box-shadow: var(--shadow);
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row > .grow { flex: 1; min-width: 0; }
      .stack > * + * { margin-top: 10px; }
      label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
      input[type="text"], input[type="password"], input[type="search"], input[type="url"], select, textarea {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); min-width: 0;
      }
      textarea { resize: vertical; min-height: 44px; }
      input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      .btn.primary:hover { background: var(--accent-strong); }
      .btn.danger { color: var(--danger); }
      .btn.small { padding: 5px 10px; font-size: 13px; }
      .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
      .badge {
        display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
        background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
      }
      .badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
      .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
      .badge.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
      .badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
      .notice { padding: 12px 14px; border-radius: 10px; margin: 0 0 12px; background: var(--accent-soft); }
      .notice.error { background: var(--danger-soft); color: var(--danger); }
      .notice.warn { background: var(--warn-soft); color: var(--warn); }
      .notice.ok { background: var(--ok-soft); color: var(--ok); }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      .mono { font-family: var(--mono); font-size: 13px; word-break: break-all; }
      .list { list-style: none; margin: 0; padding: 0; }
      .list > li { padding: 12px 0; border-top: 1px solid var(--border); }
      .list > li:first-child { border-top: 0; padding-top: 0; }
      .sas { font-family: var(--mono); font-size: 40px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); text-align: center; margin: 8px 0; }
      .copybox { display: flex; gap: 8px; align-items: stretch; }
      .copybox code { flex: 1; min-width: 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--border); font-family: var(--mono); font-size: 13px; word-break: break-all; }
      .toast {
        position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg);
        box-shadow: var(--shadow); z-index: 20; font-size: 14px;
      }
      .toast.error { background: var(--danger); color: #fff; }

      /* ---- chat ---- */
      .chat { display: flex; flex-direction: column; min-height: calc(100vh - 220px); }
      .messages { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
      .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
      .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .msg pre { margin: 8px 0; padding: 10px; background: var(--surface-2); border-radius: 8px; overflow-x: auto; white-space: pre; font-family: var(--mono); font-size: 13px; }
      .msg .by { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); white-space: normal; }
      .composer {
        position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 10px 0 4px;
        background: linear-gradient(to top, var(--bg) 75%, transparent);
      }
      @media (min-width: 900px) { .composer { bottom: 0; } }
      .composer form { display: flex; gap: 8px; align-items: flex-end; }
      .composer textarea { flex: 1; max-height: 200px; }
      .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
      .empty img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 10px; }

      /* ---- welcome / pairing ---- */
      .center { max-width: 480px; margin: 8vh auto 0; padding: 0 16px; }
      .center .card { padding: 24px; }
      .hero { text-align: center; margin-bottom: 18px; }
      .hero img { width: 64px; height: 64px; border-radius: 16px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="center"><div class="card"><p>Galahad is preparing himself…</p></div></div>
    </div>
    <noscript><div class="center"><div class="card">Galahad needs JavaScript enabled.</div></div></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
