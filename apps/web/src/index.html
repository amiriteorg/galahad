<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      "default", not "black-translucent": with a translucent status bar, iOS 26 draws its own blur
      (26.1+: a scrim) over the top of an installed app, and nothing on the page can turn it off.
      With "default" iOS paints an opaque status bar in the page's colour and the app starts below
      it. iOS reads this when the app is added to the Home Screen: an existing install keeps the
      old style until it's removed and added again.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Galahad" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Galahad: one mind, many bodies. Your autonomous knight and engineer." />
    <title>Galahad</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/boot.js"></script>
    <style>
      /* ==========================================================================
         Galahad design tokens. The full system is documented in docs/DESIGN.md.
         One token list for both themes via light-dark(); the theme override only
         flips color-scheme, so native controls and scrollbars follow too.
         ========================================================================== */
      :root {
        color-scheme: light dark;

        /* Canvas + surfaces: true neutrals, black and white with nothing in between but grey */
        --bg: light-dark(#fafafa, #08080a);
        --bg-sunken: light-dark(#f3f3f4, #050506);
        --sidebar: light-dark(#f5f5f6, #0b0b0d);
        --surface: light-dark(#ffffff, #111113);
        --surface-2: light-dark(#f4f4f5, #17171a);
        --surface-3: light-dark(#ebebed, #1f1f23);
        --surface-glass: light-dark(rgb(250 250 250 / 0.8), rgb(8 8 10 / 0.72));
        --overlay: light-dark(rgb(10 10 12 / 0.3), rgb(0 0 0 / 0.66));
        --border: light-dark(#e6e6e8, #212125);
        --border-strong: light-dark(#d4d4d8, #2e2e33);

        /* Text */
        --text: light-dark(#0a0a0b, #ededef);
        --text-2: light-dark(#52525a, #a1a1a9);
        --text-3: light-dark(#696971, #8b8b94);
        --text-inverse: light-dark(#fafafa, #0a0a0b);

        /* Accent: ink. White on dark, black on light; reserved for the owner, focus and the one primary action */
        --accent: light-dark(#0a0a0b, #ffffff);
        --accent-fill: light-dark(#0c0c0e, #e4e4e8);
        --accent-fill-top: light-dark(#3a3a3f, #ffffff);
        --accent-fill-hover: light-dark(#26262a, #f4f4f6);
        --accent-soft: light-dark(rgb(10 10 11 / 0.05), rgb(255 255 255 / 0.07));
        --accent-border: light-dark(rgb(10 10 11 / 0.24), rgb(255 255 255 / 0.26));
        --on-accent: light-dark(#ffffff, #0a0a0b);
        --focus: light-dark(#0a0a0b, #ffffff);

        /* The Crest (the emblem): faint facets, lit from the star above */
        --em-lit: light-dark(#3a3a3d, #ffffff);
        --em-mid: light-dark(#1c1c1e, #f1f1f3);
        --em-deep: light-dark(#000000, #d4d4d9);
        --em-shade: light-dark(#1a1a1c, #e2e2e6);
        --em-mid-shade: light-dark(#0c0c0d, #cdcdd3);
        --em-shade-deep: light-dark(#000000, #b4b4bc);
        --em-base: light-dark(#0c0c0d, #cdcdd3);
        /* Starlight: the faint glow at the top of the canvas */
        --glow: light-dark(rgb(10 10 11 / 0.045), rgb(255 255 255 / 0.065));
        --glow-hero: light-dark(rgb(10 10 11 / 0.07), rgb(255 255 255 / 0.12));

        /* Semantic tones (status, trust, verdict, network risk): the only colour, kept for meaning */
        --ok: light-dark(#137a43, #4cc38a);
        --ok-soft: light-dark(#e8f4ed, #11221a);
        --warn: light-dark(#965a00, #f0b549);
        --warn-soft: light-dark(#fbf2e2, #261f13);
        --danger: light-dark(#c4281c, #ff7a7a);
        --danger-soft: light-dark(#fcedeb, #2a1618);
        --danger-fill: light-dark(#c4281c, #c42b2b);
        --info: light-dark(#3f3f46, #c8c8d0);
        --info-soft: light-dark(#f1f1f3, #16161a);
        --agent: light-dark(#27272a, #e4e4e8);
        --agent-soft: light-dark(#ececee, #1b1b1f);
        --neutral: var(--text-2);
        --neutral-soft: var(--surface-2);

        /* Elevation */
        --shadow-1: 0 1px 2px light-dark(rgb(16 16 24 / 0.05), rgb(0 0 0 / 0.35));
        --shadow-2: 0 1px 3px light-dark(rgb(16 16 24 / 0.06), rgb(0 0 0 / 0.35)), 0 8px 24px light-dark(rgb(16 16 24 / 0.08), rgb(0 0 0 / 0.45));
        --shadow-3: 0 2px 8px light-dark(rgb(16 16 24 / 0.08), rgb(0 0 0 / 0.4)), 0 24px 64px light-dark(rgb(16 16 24 / 0.16), rgb(0 0 0 / 0.6));
        --ring-inset: inset 0 1px 0 light-dark(rgb(255 255 255 / 0.6), rgb(255 255 255 / 0.04));

        /* Type */
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
        --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px; --fs-16: 16px;
        --fs-18: 18px; --fs-20: 20px; --fs-24: 24px; --fs-30: 30px; --fs-40: 40px;
        --fs-body: 14px;
        --fs-input: 14px;

        /* Space, radii, sizes */
        --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;
        --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;
        --control-h: 34px;
        --control-h-sm: 28px;
        --topbar-h: 52px;
        --sidebar-w: 240px;
        --tabbar-h: 58px;
        --page-max: 1120px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);

        /* Motion: fast ease-out, transform/opacity only */
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        --d-1: 120ms; --d-2: 180ms; --d-3: 240ms; --d-sheet: 380ms;
      }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      :root[data-motion="reduce"] { --d-1: 0.01ms; --d-2: 0.01ms; --d-3: 0.01ms; --d-sheet: 0.01ms; }
      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion="full"]) { --d-1: 0.01ms; --d-2: 0.01ms; --d-3: 0.01ms; --d-sheet: 0.01ms; }
      }
      @media (pointer: coarse) { :root { --control-h: 44px; --control-h-sm: 36px; } }
      @media (max-width: 959px) { :root { --fs-body: 15px; --fs-input: 16px; } }

      /* ---------- base ---------- */
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
      body {
        margin: 0; min-height: 100%; color: var(--text);
        background: radial-gradient(1100px 520px at 60% -200px, var(--glow), transparent 70%) no-repeat, var(--bg);
        font: var(--fs-body)/1.5 var(--font-sans); font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent; overflow-x: hidden;
      }
      button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
      button { cursor: pointer; }
      a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
      h1, h2, h3, h4, p { margin: 0; }
      img, svg { display: block; }
      svg.icon { flex: none; }
      ::selection { background: color-mix(in srgb, var(--accent-fill) 28%, transparent); }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
      [hidden] { display: none !important; }
      .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      .tnum { font-variant-numeric: tabular-nums; }
      .mono { font-family: var(--font-mono); font-size: 0.92em; }
      .muted { color: var(--text-2); }
      .subtle { color: var(--text-3); }
      .small { font-size: var(--fs-13); }
      .tiny { font-size: var(--fs-12); }
      .strong { font-weight: 600; }
      .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .wrap-anywhere { overflow-wrap: anywhere; }
      .pre-wrap { white-space: pre-wrap; }
      .grow { flex: 1 1 auto; min-width: 0; }
      .row { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
      .row.wrap { flex-wrap: wrap; }
      .row.top { align-items: flex-start; }
      .row.between { justify-content: space-between; }
      .stack { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
      .stack.tight { gap: var(--sp-2); }
      .stack.loose { gap: var(--sp-5); }
      .spacer { flex: 1; }
      kbd, .kbd {
        display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
        font: 500 11px/1 var(--font-sans); color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
        border-bottom-width: 2px; border-radius: 5px;
      }

      /* ---------- boot screen (before JS) ---------- */
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot img { width: 44px; height: 44px; border-radius: 11px; opacity: 0.9; animation: boot-breathe 1.6s var(--ease-in-out) infinite alternate; }
      @keyframes boot-breathe { from { transform: scale(0.96); opacity: 0.55; } to { transform: scale(1); opacity: 0.95; } }

      /* ---------- shell ---------- */
      .shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main-col { min-width: 0; display: flex; flex-direction: column; }
      .topbar {
        position: sticky; top: 0; z-index: 20; height: calc(var(--topbar-h) + var(--safe-top));
        padding: var(--safe-top) calc(var(--sp-4) + var(--safe-right)) 0 calc(var(--sp-4) + var(--safe-left));
        display: flex; align-items: center; gap: var(--sp-2);
        background: var(--surface-glass); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .topbar .title { font-weight: 600; font-size: var(--fs-15); letter-spacing: -0.01em; transition: opacity var(--d-2) var(--ease-out), transform var(--d-2) var(--ease-out); }
      .topbar .title.tucked { opacity: 0; transform: translateY(4px); }
      .topbar .brand-mini { display: flex; align-items: center; gap: var(--sp-2); }
      .topbar .brand-mini .emblem { width: 24px; height: 24px; }
      main.view {
        flex: 1; width: 100%; outline: none;
        padding: var(--sp-5) calc(var(--sp-4) + var(--safe-right)) calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-8)) calc(var(--sp-4) + var(--safe-left));
      }
      .tabbar {
        position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
        display: grid; grid-template-columns: repeat(5, 1fr);
        height: calc(var(--tabbar-h) + var(--safe-bottom)); padding: 0 var(--safe-right) var(--safe-bottom) var(--safe-left);
        background: var(--surface-glass); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
        border-top: 1px solid var(--border);
      }
      .tab {
        position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        min-height: 44px; border: 0; background: none; color: var(--text-3); font-size: 11px; font-weight: 500; text-decoration: none;
        transition: color var(--d-1) var(--ease-out);
      }
      .tab svg { width: 22px; height: 22px; }
      .tab[aria-current="page"] { color: var(--accent); }
      .tab:active svg { transform: scale(0.92); }
      .tab .count { position: absolute; top: 6px; left: calc(50% + 6px); }

      @media (min-width: 960px) {
        .shell { grid-template-columns: var(--sidebar-w) 1fr; }
        :root[data-sidebar="collapsed"] .shell { grid-template-columns: 64px 1fr; }
        .tabbar { display: none; }
        main.view { padding: var(--sp-6) var(--sp-8) var(--sp-12); }
        .topbar { padding: 0 var(--sp-6) 0 var(--sp-8); }
        .topbar .brand-mini { display: none; }
        .sidebar {
          display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; height: 100dvh;
          background: linear-gradient(180deg, var(--sidebar), var(--bg-sunken)); border-right: 1px solid var(--border); padding: var(--sp-3) var(--sp-3) var(--sp-3);
          overflow: hidden;
        }
      }
      .sidebar-head { display: flex; align-items: center; gap: var(--sp-2); height: 40px; padding: 0 var(--sp-1) 0 var(--sp-2); margin-bottom: var(--sp-2); }
      .wordmark { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; min-width: 0; }
      .wordmark span { font-weight: 650; font-size: var(--fs-12); letter-spacing: 0.2em; text-transform: uppercase; }
      .emblem { flex: none; }
      .search-trigger {
        display: flex; align-items: center; gap: var(--sp-2); width: 100%; height: 32px; padding: 0 var(--sp-2) 0 10px; margin-bottom: var(--sp-3);
        border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--text-3); font-size: var(--fs-13);
        box-shadow: var(--shadow-1); transition: border-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out);
      }
      .search-trigger:hover { border-color: var(--border-strong); color: var(--text-2); }
      .search-trigger .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .search-trigger .kbds { margin-left: auto; display: flex; gap: 2px; }
      .nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; flex: 1; margin: 0 calc(-1 * var(--sp-1)); padding: 0 var(--sp-1); scrollbar-width: none; }
      .nav-label { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-4) var(--sp-2) var(--sp-1); }
      .nav-item {
        display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 var(--sp-2); border-radius: var(--r-md);
        color: var(--text-2); text-decoration: none; font-weight: 500; font-size: var(--fs-14); white-space: nowrap;
        transition: background-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out);
      }
      .nav-item:hover { background: var(--surface-3); color: var(--text); }
      .nav-item[aria-current="page"] { background: linear-gradient(180deg, var(--surface-2), var(--surface)); color: var(--text); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border); }
      .nav-item[aria-current="page"] svg { color: var(--accent); }
      .nav-item .count { margin-left: auto; }
      .sidebar-foot { padding-top: var(--sp-2); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
      :root[data-sidebar="collapsed"] .sidebar .label,
      :root[data-sidebar="collapsed"] .sidebar .nav-label,
      :root[data-sidebar="collapsed"] .sidebar .kbds,
      :root[data-sidebar="collapsed"] .sidebar .wordmark span,
      :root[data-sidebar="collapsed"] .sidebar .device-meta { display: none; }
      :root[data-sidebar="collapsed"] .sidebar .nav-item,
      :root[data-sidebar="collapsed"] .sidebar .search-trigger { justify-content: center; padding: 0; }
      :root[data-sidebar="collapsed"] .sidebar .nav-item .count { position: absolute; margin: -18px -22px 0 0; }
      :root[data-sidebar="collapsed"] .sidebar-head { flex-direction: column; height: auto; gap: var(--sp-2); padding: var(--sp-1) 0; }
      :root[data-sidebar="collapsed"] .sidebar .nav-item { position: relative; }
      :root[data-sidebar="collapsed"] .nav-sep { height: 1px; background: var(--border); margin: var(--sp-2) var(--sp-2); }
      .nav-sep { display: none; }
      :root[data-sidebar="collapsed"] .nav-sep { display: block; }

      .device-chip {
        display: flex; align-items: center; gap: 10px; padding: var(--sp-2); border-radius: var(--r-md); color: var(--text-2);
        text-decoration: none; min-width: 0;
      }
      .device-chip:hover { background: var(--surface-3); color: var(--text); }
      .avatar {
        flex: none; width: 28px; height: 28px; border-radius: var(--r-md); display: grid; place-items: center;
        background: var(--surface-3); color: var(--text-2);
      }
      .avatar.agent { background: var(--accent-soft); color: var(--accent); }
      /* A toned avatar: a notice's severity, a run's status, a tool's class. */
      .avatar[data-tone] { background: var(--tone-soft); color: var(--tone); }
      .device-meta { min-width: 0; line-height: 1.25; }
      .device-meta .name { color: var(--text); font-weight: 550; font-size: var(--fs-13); }
      .device-meta .id { font-size: var(--fs-11); }

      .fleet-pill {
        display: inline-flex; align-items: center; gap: var(--sp-2); height: 28px; padding: 0 10px; border-radius: var(--r-full);
        border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: var(--fs-12); font-weight: 500;
        text-decoration: none; white-space: nowrap;
      }
      .fleet-pill:hover { border-color: var(--border-strong); color: var(--text); }
      .topbar .actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-1); }

      .banner {
        display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); font-size: var(--fs-13);
        background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid color-mix(in srgb, var(--warn) 20%, transparent);
      }
      .banner .grow { color: var(--text); }

      /* ---------- page scaffolding ---------- */
      /* Navigation is frequent, so pages appear instantly (no enter animation). */
      .page { max-width: var(--page-max); margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-6); }
      .page.narrow { max-width: 760px; }
      /* A placeholder with nothing in it yet (a note, a status line) takes no room and adds no gap. Skeletons and
         live regions stay: one holds a place, the other must exist before it speaks. */
      :is(.page, .stack, .sheet-body) > div:empty:not(.skeleton):not([role]):not([aria-live]) { display: none; }
      .page.full { max-width: none; }
      @keyframes page-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .page-head { display: flex; align-items: flex-end; gap: var(--sp-4); flex-wrap: wrap; }
      .page-head h1 { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.022em; line-height: 1.2; }
      .page-head .lede { color: var(--text-2); margin-top: var(--sp-1); max-width: 64ch; }
      .page-head .actions { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }
      @media (max-width: 639px) { .page-head .actions { margin-left: 0; } }
      /* Search and one filter control, side by side: the list starts right under them. */
      .filter-bar { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
      .filter-bar > .input-wrap { flex: 1 1 auto; min-width: 0; }
      .filter-bar > .selector-trigger { flex: 0 1 auto; height: var(--control-h); max-width: 60%; }
      .section { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
      .section-head { display: flex; align-items: center; gap: var(--sp-2); min-height: 28px; }
      .section-head h2 { font-size: var(--fs-13); font-weight: 600; color: var(--text-2); letter-spacing: 0.01em; }
      .section-head .count-label { color: var(--text-3); font-size: var(--fs-12); }
      .section-head .actions { margin-left: auto; display: flex; gap: var(--sp-1); align-items: center; }
      h3 { font-size: var(--fs-15); font-weight: 600; letter-spacing: -0.01em; }

      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1), var(--ring-inset);
        min-width: 0;
      }
      .card.pad { padding: var(--sp-4); }
      .card.pad-lg { padding: var(--sp-6); }
      .card.flat { box-shadow: none; }
      .card.accent { border-color: var(--accent-border); box-shadow: var(--shadow-1), 0 0 0 3px color-mix(in srgb, var(--accent-fill) 8%, transparent); }
      .card.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); }
      .card.danger { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
      .card-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); min-height: 48px; }
      .card-head h3 { font-size: var(--fs-14); }
      .card-body { padding: var(--sp-4); }
      .card-foot { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); background: var(--bg-sunken); border-radius: 0 0 var(--r-lg) var(--r-lg); }
      .grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
      .grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
      .grid.stats { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
      .two-col { display: grid; gap: var(--sp-6); grid-template-columns: 1fr; }
      @media (min-width: 1100px) { .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); } }
      .divider { height: 1px; background: var(--border); border: 0; margin: 0; }

      /* ---------- list rows ---------- */
      .rows { display: flex; flex-direction: column; }
      .rows > .item { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); min-width: 0; align-items: flex-start; }
      .rows > .item:first-child { border-top: 0; }
      .rows > .item.center { align-items: center; }
      /* A whole row that opens something (an artifact). */
      .rows > .item-button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border); font: inherit; color: inherit; cursor: pointer; align-items: center; }
      .rows > .item-button:first-child { border-top: 0; }
      .rows > .item-button:hover { background: var(--surface-2); }
      .rows > .item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); color: var(--text-3); font-size: var(--fs-12); margin-top: 6px; }
      .rows > .item .item-actions { display: flex; gap: var(--sp-1); align-items: center; flex: none; }
      @media (hover: hover) {
        .rows > .item .reveal { opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
        .rows > .item:hover .reveal, .rows > .item:focus-within .reveal { opacity: 1; }
      }

      /* ---------- buttons ---------- */
      .btn {
        --btn-bg: var(--surface); --btn-fg: var(--text); --btn-border: var(--border-strong);
        position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        height: var(--control-h); padding: 0 var(--sp-3); border-radius: var(--r-md);
        border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-fg);
        font-size: var(--fs-13); font-weight: 550; white-space: nowrap; text-decoration: none; user-select: none;
        box-shadow: var(--shadow-1); transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), opacity var(--d-1);
      }
      .btn:hover { --btn-bg: var(--surface-2); }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
      .btn.primary {
        --btn-bg: var(--accent-fill); --btn-fg: var(--on-accent); --btn-border: transparent;
        background: linear-gradient(180deg, var(--accent-fill-top), var(--btn-bg));
        box-shadow: var(--shadow-1), inset 0 1px 0 rgb(255 255 255 / 0.14), 0 0 0 1px color-mix(in srgb, var(--accent-fill) 60%, transparent);
      }
      .btn.primary:hover { --btn-bg: var(--accent-fill-hover); }
      .btn.danger { --btn-fg: var(--danger); }
      .btn.danger:hover { --btn-bg: var(--danger-soft); --btn-border: color-mix(in srgb, var(--danger) 35%, transparent); }
      .btn.danger-solid { --btn-bg: var(--danger-fill); --btn-fg: #fff; --btn-border: transparent; }
      .btn.danger-solid:hover { --btn-bg: color-mix(in srgb, var(--danger-fill) 88%, black); }
      .btn.ghost { --btn-bg: transparent; --btn-border: transparent; box-shadow: none; color: var(--text-2); }
      .btn.ghost:hover { --btn-bg: var(--surface-3); color: var(--text); }
      .btn.sm { height: var(--control-h-sm); padding: 0 10px; font-size: var(--fs-12); border-radius: var(--r-sm); gap: 5px; }
      .btn.lg { height: 42px; padding: 0 var(--sp-5); font-size: var(--fs-14); border-radius: 10px; }
      .btn.icon-only { width: var(--control-h); padding: 0; }
      .btn.sm.icon-only { width: var(--control-h-sm); }
      .btn.block { width: 100%; }
      .btn .spinner { width: 14px; height: 14px; }
      .btn[aria-busy="true"] > :not(.spinner) { opacity: 0.6; }
      .btn-group { display: inline-flex; gap: var(--sp-2); flex-wrap: wrap; }

      .spinner { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; opacity: 0.8; flex: none; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- badges, chips, dots, counts ---------- */
      /* Tones come from [data-tone] (or an ancestor); components only supply fallbacks. */
      .badge {
        display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--r-full);
        background: var(--tone-soft, var(--surface-2)); color: var(--tone, var(--text-2)); font-size: var(--fs-12); font-weight: 550; white-space: nowrap; line-height: 1;
        border: 1px solid color-mix(in srgb, var(--tone, var(--text-2)) 14%, transparent);
      }
      .badge svg { width: 12px; height: 12px; }
      .badge.outline { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
      [data-tone="ok"] { --tone: var(--ok); --tone-soft: var(--ok-soft); }
      [data-tone="warn"] { --tone: var(--warn); --tone-soft: var(--warn-soft); }
      [data-tone="danger"] { --tone: var(--danger); --tone-soft: var(--danger-soft); }
      [data-tone="info"] { --tone: var(--info); --tone-soft: var(--info-soft); }
      [data-tone="accent"] { --tone: var(--accent); --tone-soft: var(--accent-soft); }
      [data-tone="agent"] { --tone: var(--agent); --tone-soft: var(--agent-soft); }
      [data-tone="neutral"] { --tone: var(--text-2); --tone-soft: var(--surface-2); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone, var(--text-3)); flex: none; display: inline-block; }
      .dot:not([data-tone]) { --tone: var(--text-3); }
      .dot.live { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone, var(--text-3)) 22%, transparent); }
      .dot.pulse { animation: pulse 2s var(--ease-in-out) infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 12%, transparent); } }
      .count {
        display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-full);
        background: var(--accent-fill); color: var(--on-accent); font-size: 11px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums;
      }
      .count.quiet { background: var(--surface-3); color: var(--text-2); }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--sp-2); border-radius: var(--r-sm);
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: var(--fs-12); font-weight: 500; white-space: nowrap;
      }
      .chip svg { width: 13px; height: 13px; color: var(--text-3); }
      .chip.on { color: var(--text); }
      .chip.on svg { color: var(--ok); }
      button.chip { cursor: pointer; transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1), color var(--d-1); }
      button.chip:hover { border-color: var(--border-strong); color: var(--text); }
      button.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
      button.chip[aria-pressed="true"] svg { color: var(--accent); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-12); border: 1px solid var(--border); }
      button.tag { cursor: pointer; }
      button.tag:hover { color: var(--accent); border-color: var(--accent-border); }

      /* ---------- forms ---------- */
      .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .field > label, .label { font-size: var(--fs-13); font-weight: 550; color: var(--text); }
      .field .hint { font-size: var(--fs-12); color: var(--text-3); }
      .field .error { font-size: var(--fs-12); color: var(--danger); }
      .fields { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
      .input, .select, .textarea {
        width: 100%; min-width: 0; height: var(--control-h); padding: 0 10px; border-radius: var(--r-md);
        border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--fs-input);
        box-shadow: var(--shadow-1); transition: border-color var(--d-1) var(--ease-out), box-shadow var(--d-1) var(--ease-out);
      }
      .textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
      .select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
      .input::placeholder, .textarea::placeholder { color: var(--text-3); }
      .input:hover, .select:hover, .textarea:hover { border-color: color-mix(in srgb, var(--text-3) 60%, var(--border-strong)); }
      .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      .input:disabled, .select:disabled, .textarea:disabled { opacity: 0.55; cursor: not-allowed; }
      .input.mono { font-family: var(--font-mono); font-size: calc(var(--fs-input) - 1px); }
      .input-wrap { position: relative; display: flex; align-items: center; }
      .input-wrap > svg { position: absolute; left: 10px; color: var(--text-3); pointer-events: none; }
      .input-wrap > .input { padding-left: 34px; }
      .input-wrap > .trail { position: absolute; right: 6px; display: flex; gap: 4px; align-items: center; }
      .secret-field { position: relative; }
      .secret-field .input { padding-left: 34px; letter-spacing: 0.08em; font-family: var(--font-mono); }
      .secret-field .input::placeholder { font-family: var(--font-sans); letter-spacing: normal; }
      /* A pasted key is never shown back, not even by the browser's own reveal button. */
      input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
      .secret-field > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); }

      .segmented {
        position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; isolation: isolate; max-width: 100%;
      }
      .segmented .thumb {
        position: absolute; z-index: -1; top: 2px; bottom: 2px; left: 0; border-radius: 8px; background: var(--surface);
        box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border); transition: transform var(--d-3) var(--ease-out), width var(--d-3) var(--ease-out);
      }
      .segmented button {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--control-h) - 6px); padding: 0 var(--sp-3);
        border: 0; background: none; border-radius: 8px; color: var(--text-2); font-size: var(--fs-13); font-weight: 550; white-space: nowrap;
        transition: color var(--d-1) var(--ease-out);
      }
      .segmented button:hover { color: var(--text); }
      .segmented button:disabled { color: var(--text-3); opacity: 0.6; cursor: not-allowed; }
      .segmented button[aria-checked="true"] { color: var(--text); }
      .segmented button[aria-checked="true"] svg { color: var(--seg-tone, var(--accent)); }
      .segmented.block { display: grid; width: 100%; }
      .segmented.sm button { height: calc(var(--control-h-sm) - 4px); font-size: var(--fs-12); padding: 0 10px; }

      .switch { position: relative; display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; min-height: 32px; }
      .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .switch .track { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background-color var(--d-2) var(--ease-out), border-color var(--d-2); }
      .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: transform var(--d-2) var(--ease-out); }
      .switch input:checked + .track { background: var(--accent-fill); border-color: transparent; }
      .switch input:checked + .track::after { transform: translateX(14px); }
      .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
      .switch input:disabled + .track { opacity: 0.5; }

      .range { display: flex; flex-direction: column; gap: 6px; }
      .range .range-top { display: flex; justify-content: space-between; align-items: baseline; }
      .range output { font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--fs-13); }
      .range input[type="range"] { width: 100%; height: 24px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; --fill: 50%; }
      .range input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent-fill) var(--fill), var(--surface-3) var(--fill)); }
      .range input[type="range"]::-moz-range-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent-fill) var(--fill), var(--surface-3) var(--fill)); }
      .range input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
      .range input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
      .range input[type="range"]:focus-visible { outline: none; }
      .range input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); }
      .range .scale { display: flex; justify-content: space-between; font-size: var(--fs-11); color: var(--text-3); font-variant-numeric: tabular-nums; }

      .chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: var(--control-h); padding: 4px 6px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); cursor: text; }
      .chip-input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      .chip-input input { flex: 1; min-width: 100px; border: 0; outline: none; background: none; height: 24px; font-size: var(--fs-input); }
      .chip-input .tag button { border: 0; background: none; padding: 0 0 0 4px; color: var(--text-3); display: inline-flex; }
      .chip-input .tag button:hover { color: var(--danger); }

      /* ---------- callouts, states ---------- */
      .callout {
        display: flex; gap: 10px; align-items: flex-start; padding: var(--sp-3); border-radius: var(--r-md);
        background: var(--tone-soft, var(--info-soft)); border: 1px solid color-mix(in srgb, var(--tone, var(--info)) 18%, transparent); color: var(--text); font-size: var(--fs-13);
      }
      .callout > svg { color: var(--tone, var(--info)); margin-top: 1px; }
      .callout .callout-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
      .callout .callout-title { font-weight: 600; }
      .callout.quiet { background: var(--surface-2); border-color: var(--border); --tone: var(--text-3); }
      .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2); padding: var(--sp-10) var(--sp-4); color: var(--text-2); }
      .empty .empty-icon { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); margin-bottom: var(--sp-1); }
      .empty h3 { color: var(--text); font-size: var(--fs-15); }
      .empty p { max-width: 44ch; font-size: var(--fs-13); }
      .empty .btn-group { margin-top: var(--sp-2); justify-content: center; }
      .empty.compact { padding: var(--sp-6) var(--sp-4); }
      .skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r-sm); }
      .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, light-dark(rgb(255 255 255 / 0.6), rgb(255 255 255 / 0.04)), transparent); animation: shimmer 1.4s infinite; }
      :root[data-motion="reduce"] .skeleton::after { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .skeleton::after { animation: none; } }
      @keyframes shimmer { to { transform: translateX(100%); } }
      .sk-line { height: 12px; }
      .sk-row { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); }
      .sk-row:first-child { border-top: 0; }

      /* ---------- stat tiles, meters ---------- */
      .stat { padding: var(--sp-4); display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out); }
      a.stat:hover { border-color: var(--border-strong); }
      .stat .stat-label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); font-weight: 550; color: var(--text-2); }
      .stat .stat-label svg { width: 14px; height: 14px; color: var(--text-3); }
      .stat .stat-value { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .stat .stat-value .of { color: var(--text-3); font-weight: 500; font-size: var(--fs-16); }
      .stat .stat-note { font-size: var(--fs-12); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
      /* On a phone the figures stay, smaller and tighter: the lists under them reach the first screen. */
      @media (max-width: 639px) {
        .grid.stats { gap: var(--sp-2); grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stat { padding: var(--sp-3); gap: 2px; }
        .stat .stat-value { font-size: var(--fs-20); }
        .stat .stat-value .of { font-size: var(--fs-14); }
        .stat .stat-note { line-height: 1.35; }
        .stat-skeleton { height: 86px; }
      }
      .stat-skeleton { height: 110px; border-radius: var(--r-lg); }
      .meter { position: relative; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
      .meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--tone, var(--accent-fill)); transform-origin: left; }
      .kv { display: grid; margin: 0; grid-template-columns: max-content 1fr; gap: 6px var(--sp-4); font-size: var(--fs-13); align-items: baseline; }
      .kv dt { color: var(--text-3); }
      .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

      /* ---------- copy fields, codes ---------- */
      .copyfield { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-sunken); overflow: hidden; }
      .copyfield code { flex: 1; min-width: 0; padding: 9px 12px; font: 13px/1.5 var(--font-mono); overflow-wrap: anywhere; user-select: all; }
      .copyfield .btn { border-radius: 0; border: 0; border-left: 1px solid var(--border-strong); height: auto; box-shadow: none; }
      .sas { display: flex; justify-content: center; gap: 6px; margin: var(--sp-2) 0; min-width: 0; }
      .sas span {
        display: grid; place-items: center; flex: 1 1 0; min-width: 0; max-width: 44px; aspect-ratio: 44 / 56; border-radius: 10px; background: var(--surface); border: 1px solid var(--accent-border);
        font: 650 clamp(20px, 6.5vw, 28px)/1 var(--font-mono); color: var(--accent); box-shadow: var(--shadow-1); font-variant-numeric: tabular-nums;
      }
      .sas span:nth-child(3) { margin-right: 8px; }
      @media (max-width: 639px) { .solo-card .card { padding: var(--sp-5); } }
      .ring { --p: 1; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--accent-fill) calc(var(--p) * 360deg), var(--surface-3) 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); flex: none; }

      /* ---------- dialogs: centered on desktop, bottom sheet on phones ---------- */
      dialog.sheet {
        padding: 0; border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text);
        width: min(560px, calc(100vw - 32px)); max-height: min(86vh, 860px); box-shadow: var(--shadow-3); overflow: hidden;
        display: flex; flex-direction: column; opacity: 0; transform: translateY(8px) scale(0.98);
        transition: opacity var(--d-2) var(--ease-out), transform var(--d-2) var(--ease-out), overlay var(--d-2) allow-discrete, display var(--d-2) allow-discrete;
      }
      dialog.sheet:not([open]) { display: none; }
      dialog.sheet[open].shown { opacity: 1; transform: none; }
      dialog.sheet.wide { width: min(760px, calc(100vw - 32px)); }
      dialog.sheet.small { width: min(440px, calc(100vw - 32px)); }
      dialog.sheet::backdrop { background: var(--overlay); opacity: 0; transition: opacity var(--d-2) var(--ease-out); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
      dialog.sheet.shown::backdrop { opacity: 1; }
      .sheet-handle { display: none; }
      .sheet-head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-5) var(--sp-5) var(--sp-3); }
      .sheet-head h2 { font-size: var(--fs-18); font-weight: 650; letter-spacing: -0.015em; }
      .sheet-head .sub { color: var(--text-2); font-size: var(--fs-13); margin-top: 2px; }
      .sheet-body { padding: var(--sp-2) var(--sp-5) var(--sp-5); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: var(--sp-4); }
      .sheet-foot { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--border); background: var(--bg-sunken); flex-wrap: wrap; }
      @media (max-width: 639px) {
        dialog.sheet, dialog.sheet.wide, dialog.sheet.small {
          width: 100vw; max-width: 100vw; max-height: calc(100dvh - var(--safe-top) - 24px); margin: auto 0 0; border-radius: 18px 18px 0 0; border-bottom: 0;
          transform: translateY(100%); opacity: 1; transition: transform var(--d-sheet) var(--ease-drawer), overlay var(--d-sheet) allow-discrete, display var(--d-sheet) allow-discrete;
          padding-bottom: var(--safe-bottom);
        }
        dialog.sheet[open].shown { transform: translateY(var(--drag, 0px)); }
        dialog.sheet.dragging { transition: none; }
        .sheet-handle { display: block; flex: none; height: 22px; touch-action: none; cursor: grab; position: relative; }
        .sheet-handle::after { content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 5px; margin-left: -18px; border-radius: 99px; background: var(--border-strong); }
        .sheet-head { padding-top: var(--sp-1); }
        .sheet-foot .btn { flex: 1; }
      }

      /* ---------- command palette ---------- */
      dialog.palette {
        margin: 12vh auto auto; padding: 0; width: min(620px, calc(100vw - 24px)); max-height: min(70vh, 560px);
        border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
        overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: scale(0.98);
        transition: opacity var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), overlay var(--d-1) allow-discrete, display var(--d-1) allow-discrete;
      }
      dialog.palette:not([open]) { display: none; }
      dialog.palette.shown { opacity: 1; transform: none; }
      dialog.palette::backdrop { background: var(--overlay); opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
      dialog.palette.shown::backdrop { opacity: 1; }
      @media (max-width: 639px) { dialog.palette { margin-top: calc(var(--safe-top) + 12px); max-height: 70dvh; } }
      .palette-input { display: flex; align-items: center; gap: 10px; padding: 0 var(--sp-4); height: 54px; border-bottom: 1px solid var(--border); }
      .palette-input input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: var(--fs-16); }
      /* The field is focused whenever the palette is open: an ink rule under it says so. */
      .palette-input:focus-within { box-shadow: inset 0 -2px 0 var(--focus); }
      .palette-input svg { color: var(--text-3); }
      .palette-input:focus-within svg { color: var(--text); }
      .palette-list { overflow-y: auto; padding: var(--sp-2); overscroll-behavior: contain; }
      .palette-group { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-2) var(--sp-2) var(--sp-1); }
      .palette-item { display: flex; align-items: center; gap: var(--sp-3); height: 40px; padding: 0 var(--sp-2) 0 10px; border-radius: var(--r-md); cursor: pointer; color: var(--text-2); }
      .palette-item svg { color: var(--text-3); }
      .palette-item .pl-label { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .palette-item .pl-label mark { background: none; color: var(--accent); font-weight: 650; }
      .palette-item .pl-hint { font-size: var(--fs-12); color: var(--text-3); }
      .palette-item[aria-selected="true"] { background: var(--surface-3); }
      .palette-item[aria-selected="true"] svg { color: var(--accent); }
      .palette-foot { display: flex; gap: var(--sp-4); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); color: var(--text-3); font-size: var(--fs-12); background: var(--bg-sunken); }
      .palette-foot span { display: inline-flex; align-items: center; gap: 4px; }
      @media (pointer: coarse) { .palette-foot { display: none; } .palette-item { height: 46px; } }

      /* ---------- smart selector: one control that says what's chosen, the choices in a popover (a sheet on phones) ---------- */
      .selector-trigger {
        display: inline-flex; align-items: center; gap: 6px; height: var(--control-h-sm); max-width: 100%; min-width: 0; padding: 0 8px 0 10px;
        border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); color: var(--text);
        font-size: var(--fs-13); font-weight: 550; white-space: nowrap; box-shadow: var(--shadow-1); user-select: none;
        transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out);
      }
      .selector-trigger:hover { background: var(--surface-2); }
      .selector-trigger:active { transform: scale(0.97); }
      .selector-trigger[aria-expanded="true"] { border-color: var(--focus); }
      /* Something other than the default is chosen (a filter is on): the owner's ink. */
      .selector-trigger[data-active="true"] { border-color: var(--accent-border); background: var(--accent-soft); }
      .selector-trigger.ghost { border-color: transparent; background: transparent; box-shadow: none; }
      .selector-trigger.ghost:hover { background: var(--surface-3); }
      .selector-trigger .sel-lead { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
      .selector-trigger .sel-current { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .selector-trigger .sel-chev { color: var(--text-3); margin-left: -1px; }
      dialog.selector-pop {
        position: fixed; inset: auto; margin: 0; padding: 0; width: 320px; max-height: 440px;
        border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
        overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: translateY(-4px) scale(0.98); transform-origin: top left;
        transition: opacity var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), overlay var(--d-1) allow-discrete, display var(--d-1) allow-discrete;
      }
      dialog.selector-pop.above { transform: translateY(4px) scale(0.98); transform-origin: bottom left; }
      dialog.selector-pop:not([open]) { display: none; }
      dialog.selector-pop.shown { opacity: 1; transform: none; }
      dialog.selector-pop::backdrop { background: transparent; }
      .sel-search { flex: none; display: flex; align-items: center; gap: var(--sp-2); height: 42px; padding: 0 var(--sp-3); border-bottom: 1px solid var(--border); color: var(--text-3); }
      .sel-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; font-size: var(--fs-input); }
      .sel-search input::placeholder { color: var(--text-3); }
      .sel-search:focus-within { box-shadow: inset 0 -2px 0 var(--focus); color: var(--text); }
      .sel-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-1); outline: none; }
      /* Keyboard focus sits on the list; the option it would choose carries the ring. */
      .sel-list:focus-visible { outline: none; }
      .sel-list:focus-visible .sel-option[data-active="true"] { box-shadow: inset 0 0 0 2px var(--focus); }
      .sel-group + .sel-group { margin-top: var(--sp-1); padding-top: var(--sp-1); border-top: 1px solid var(--border); }
      .sel-group-label { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-2) var(--sp-2) var(--sp-1); }
      .sel-option { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 5px var(--sp-2); border-radius: var(--r-md); cursor: pointer; color: var(--text-2); }
      .sel-option[data-active="true"] { background: var(--surface-3); }
      .sel-option > svg.icon { color: var(--text-3); }
      .sel-option[aria-selected="true"] > svg.icon, .sel-option[data-active="true"] > svg.icon { color: var(--accent); }
      .sel-option[aria-disabled="true"] { cursor: not-allowed; }
      .sel-option[aria-disabled="true"] .sel-label { color: var(--text-3); }
      .sel-option .sel-mark { flex: none; width: 15px; display: grid; place-items: center; color: var(--accent); }
      .sel-option .sel-box { flex: none; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; border: 1.5px solid var(--border-strong); background: var(--surface); }
      .sel-option[aria-selected="true"] .sel-box { background: var(--accent-fill); border-color: transparent; color: var(--on-accent); }
      .sel-option .sel-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
      .sel-option .sel-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-option[aria-selected="true"] .sel-label { font-weight: 550; }
      .sel-option .sel-label mark { background: none; color: var(--accent); font-weight: 650; }
      .sel-option .sel-meta { font-size: var(--fs-12); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-empty { padding: var(--sp-5) var(--sp-3); text-align: center; color: var(--text-3); font-size: var(--fs-13); }
      .sel-foot { flex: none; padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--border); background: var(--bg-sunken); font-size: var(--fs-12); color: var(--text-3); }
      /* On phones the same choices sit in a bottom sheet: the sheet scrolls, its rows are thumb-sized. */
      dialog.selector-sheet .sheet-body { gap: var(--sp-2); padding-left: var(--sp-3); padding-right: var(--sp-3); }
      dialog.selector-sheet .sel-search { height: var(--control-h); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); margin: 0 var(--sp-2); }
      dialog.selector-sheet .sel-search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      dialog.selector-sheet .sel-list { overflow: visible; padding: 0; }
      dialog.selector-sheet .sel-foot { margin: 0 var(--sp-2); border: 0; background: none; padding: var(--sp-1) 0 0; }
      @media (pointer: coarse) { .sel-option { min-height: 48px; } }

      /* ---------- toasts (stacked, newest in front) ---------- */
      .toaster { position: fixed; z-index: 1000; right: calc(var(--sp-4) + var(--safe-right)); bottom: calc(var(--sp-4) + var(--safe-bottom)); width: min(380px, calc(100vw - 32px)); pointer-events: none; }
      @media (max-width: 959px) { .toaster { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-3)); } }
      .toast {
        --i: 0; position: absolute; right: 0; bottom: 0; width: 100%; pointer-events: auto;
        display: flex; align-items: flex-start; gap: 10px; padding: var(--sp-3) var(--sp-3) var(--sp-3) 14px;
        background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-2);
        font-size: var(--fs-13); transform-origin: bottom center;
        transform: translateY(calc(var(--i) * -10px)) scale(calc(1 - var(--i) * 0.05)); opacity: calc(1 - var(--i) * 0.2);
        transition: transform var(--d-3) var(--ease-out), opacity var(--d-3) var(--ease-out);
      }
      .toast.entering { transform: translateY(110%); opacity: 0; }
      .toast.leaving { transform: translateY(40%); opacity: 0; transition-duration: var(--d-2); }
      .toast[data-hidden="true"] { opacity: 0; pointer-events: none; }
      .toaster:hover .toast, .toaster:focus-within .toast { transform: translateY(calc(var(--offset, 0px) * -1)); opacity: 1; }
      .toast > svg { margin-top: 1px; color: var(--tone, var(--text-2)); }
      .toast .toast-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .toast .toast-title { font-weight: 600; }
      .toast .toast-desc { color: var(--text-2); overflow-wrap: anywhere; }
      .toast .btn { flex: none; }

      /* ---------- markdown ---------- */
      .md { line-height: 1.65; overflow-wrap: anywhere; }
      .md > * + * { margin-top: 0.75em; }
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; margin-top: 1.1em; }
      .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; } .md h4, .md h5, .md h6 { font-size: 1em; }
      .md ul, .md ol { padding-left: 1.4em; margin-bottom: 0; }
      .md li + li { margin-top: 0.3em; }
      .md li > * + * { margin-top: 0.4em; }
      .md li::marker { color: var(--text-3); }
      .md blockquote { margin: 0; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--border-strong); color: var(--text-2); }
      .md hr { border: 0; height: 1px; background: var(--border); }
      .md code { font: 0.88em/1.4 var(--font-mono); padding: 0.12em 0.36em; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }
      .md a { overflow-wrap: anywhere; }
      .md .host { color: var(--text-3); font-size: 0.85em; margin-left: 2px; }
      .codeblock { position: relative; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-sunken); overflow: hidden; }
      .codeblock .cb-head { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-3); }
      .codeblock pre { margin: 0; padding: 12px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); tab-size: 2; }
      .codeblock pre code { background: none; border: 0; padding: 0; font: inherit; }
      .md .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
      .md table { border-collapse: collapse; width: 100%; font-size: 0.93em; }
      .md th, .md td { padding: 7px 10px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .md thead th { border-top: 0; background: var(--surface-2); font-weight: 600; }
      .md mark, mark.hl { background: color-mix(in srgb, var(--warn) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

      /* ---------- chat ---------- */
      .chat { display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; min-height: calc(100dvh - var(--topbar-h) - var(--tabbar-h) - 60px); }
      @media (min-width: 960px) { .chat { min-height: calc(100dvh - var(--topbar-h) - 48px); } }
      /* One row: the chat's options in words (who answers, project, kept or not), then Chats and New chat. */
      .chat-head { display: flex; align-items: center; gap: var(--sp-2); padding-bottom: var(--sp-3); min-width: 0; }
      .chat-head .chat-options { flex: 0 1 auto; }
      .chat-head .btn { flex: none; }
      .chat-sub { display: flex; align-items: center; gap: var(--sp-2); margin-top: calc(-1 * var(--sp-1)); padding-bottom: var(--sp-3); min-width: 0; }
      .chat-sub:empty { display: none; }
      .chat-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font: inherit; font-weight: 600; color: var(--text); background: none; border: 0; cursor: pointer; padding: 2px 6px; margin-left: -6px; border-radius: var(--r-sm); max-width: min(100%, 520px); }
      .selector-trigger.icon-only { width: var(--control-h-sm); padding: 0; justify-content: center; flex: none; }
      .selector-trigger.icon-only .sel-current, .selector-trigger.icon-only .sel-chev { display: none; }
      .selector-trigger.icon-only .sel-lead { color: inherit; }
      .chat-title:hover { background: var(--surface-2); }
      .chat-row { font: inherit; text-align: left; width: 100%; background: none; border: 0; cursor: pointer; color: inherit; }
      .chat-row:hover, .chat-row[aria-current="true"] { background: var(--surface-2); }
      .recent-chats { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: min(100%, 520px); margin: var(--sp-6) auto 0; text-align: left; }
      .card-link { font: inherit; text-align: left; color: inherit; cursor: pointer; }
      .card-link:hover { border-color: var(--border-strong); }
      .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .thread { flex: 1; display: flex; flex-direction: column; gap: var(--sp-6); padding-bottom: var(--sp-6); }
      .turn { display: flex; gap: var(--sp-3); min-width: 0; }
      .turn.user { justify-content: flex-end; }
      .turn.user .bubble { max-width: min(88%, 620px); background: var(--surface-2); border: 1px solid var(--border); padding: 9px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .turn.assistant .turn-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
      .turn .avatar { margin-top: 1px; }
      .turn-actions { display: flex; gap: 2px; min-height: 28px; }
      @media (hover: hover) {
        .turn .turn-actions { opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
        .turn:hover .turn-actions, .turn:focus-within .turn-actions, .turn.last .turn-actions { opacity: 1; }
      }
      .turn.user .turn-actions { justify-content: flex-end; }
      .turn-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 0; }
      .caret { display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: text-bottom; border-radius: 2px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      .process { display: flex; flex-direction: column; gap: 0; font-size: var(--fs-12); color: var(--text-2); }
      .process summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; color: var(--text-3); width: fit-content; border-radius: var(--r-sm); padding: 2px 6px 2px 2px; }
      .process summary::-webkit-details-marker { display: none; }
      @media (pointer: coarse) { .process summary { min-height: 32px; } }
      .process summary:hover { color: var(--text-2); background: var(--surface-2); }
      .process summary svg { transition: transform var(--d-2) var(--ease-out); }
      .process[open] summary .chev { transform: rotate(90deg); }
      .steps { list-style: none; margin: 6px 0 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 0; }
      .step { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; position: relative; padding-bottom: 8px; }
      .step:not(:last-child)::before { content: ""; position: absolute; left: 7.5px; top: 17px; bottom: 0; width: 1px; background: var(--border); }
      .step .step-mark { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); }
      .step .step-mark svg { width: 14px; height: 14px; }
      .step[data-state="active"] .step-mark { color: var(--accent); }
      .step[data-state="done"] .step-mark { color: var(--ok); }
      .step[data-state="warn"] .step-mark { color: var(--warn); }
      .step[data-state="error"] .step-mark { color: var(--danger); }
      .step .step-text { line-height: 16px; min-width: 0; }
      .step .step-detail { color: var(--text-3); overflow-wrap: anywhere; }
      .live-line { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--text-2); font-size: var(--fs-13); }
      /* The composer sticks to the bottom; on the chat page main drops its extra bottom space so the
         composer's resting place and its sticky place coincide (nothing hides behind it). */
      .composer-wrap { position: sticky; bottom: calc(var(--tabbar-h) + var(--safe-bottom)); padding: var(--sp-2) 0 var(--sp-3); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
      .shell[data-route="chat"] main.view { padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom)); }
      @media (min-width: 960px) {
        .composer-wrap { bottom: 0; padding-bottom: var(--sp-5); }
        .shell[data-route="chat"] main.view { padding-bottom: 0; }
      }
      .shell[data-route="chat"] .activity-pill { display: none; }
      /* The on-screen keyboard is up (iOS keeps the page full height under it): the tab bar steps aside
         and the composer sits on the keyboard instead of a tab bar's height above it. */
      :root[data-keyboard="open"] .tabbar { display: none; }
      :root[data-keyboard="open"] .composer-wrap { bottom: 0; }
      :root[data-keyboard="open"] main.view, :root[data-keyboard="open"] .shell[data-route="chat"] main.view { padding-bottom: var(--sp-3); }
      @media (max-width: 639px) {
        .shell:not([data-route="chat"]) .topbar .activity-pill:not([hidden]) ~ .fleet-pill { display: none; }
        .chat-head .new-chat > span { display: none; }
        .chat-head .new-chat { width: var(--control-h-sm); padding: 0; }
      }
      .composer { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-2); transition: border-color var(--d-1) var(--ease-out), box-shadow var(--d-1) var(--ease-out); }
      .composer:focus-within { border-color: color-mix(in srgb, var(--focus) 60%, var(--border-strong)); box-shadow: var(--shadow-2), 0 0 0 3px color-mix(in srgb, var(--focus) 14%, transparent); }
      .composer textarea { display: block; width: 100%; border: 0; outline: none; background: none; resize: none; padding: 12px 14px 4px; max-height: 40vh; min-height: 48px; line-height: 1.5; font-size: var(--fs-input); }
      .composer .composer-bar { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 8px 8px 12px; }
      .composer .hint { font-size: var(--fs-12); color: var(--text-3); }
      .composer .send { width: 34px; height: 34px; padding: 0; border-radius: 10px; }
      @media (pointer: coarse) { .composer .send { width: 40px; height: 40px; } }
