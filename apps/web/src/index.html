      .rows > .item.dir-row { align-items: center; gap: var(--sp-2); padding-top: var(--sp-2); padding-bottom: var(--sp-2); background: var(--bg-sunken); color: var(--text-3); font: var(--fs-12)/1.5 var(--font-mono); }
      /* A fact of yours (about-you.ts): its words across the row's width, whose it is and its answers under them. */
      .item.fact { flex-direction: column; align-items: stretch; gap: var(--sp-2); }
      .rows > .item > .item-chevron { flex: none; color: var(--text-3); }
      /* A setting's row: on a narrow screen its control goes under its words. */
      .rows > .item.wrap { flex-wrap: wrap; }
      .rows > .item.wrap > .item-text { flex-basis: 200px; }
      /* Small facts side by side (meta()): quiet type, tabular figures, so a time or a count changing doesn't move them. */
      .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); min-width: 0; color: var(--text-3); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
      /* A line about what's near it (note()): a section, a list, a form. */
      .note { color: var(--text-3); font-size: var(--fs-12); line-height: 1.5; }
      /* An icon beside a line of text, level with its first line. */
      .line-icon { flex: none; padding-top: 3px; color: var(--text-3); }
      .rows > .note { padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); }
      /* A form's actions (formActions()), at its end, the primary one last. */
      .form-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--sp-2); }
      @media (hover: hover) {
        .rows > .item .reveal { opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
        .rows > .item:hover .reveal, .rows > .item:focus-within .reveal { opacity: 1; }
      }

      /* ---------- buttons ---------- */
      .btn {
        --btn-bg: var(--surface); --btn-fg: var(--text); --btn-border: var(--border-strong);
        position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        height: var(--control-h); padding: 0 var(--sp-3); border-radius: var(--r-md);
        border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-fg);
        font-size: var(--fs-13); font-weight: 550; white-space: nowrap; text-decoration: none; user-select: none;
        box-shadow: var(--shadow-1); transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), opacity var(--d-1);
      }
      .btn:hover { --btn-bg: var(--surface-2); }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
      .btn.primary {
        --btn-bg: var(--accent-fill); --btn-fg: var(--on-accent); --btn-border: transparent;
        background: linear-gradient(180deg, var(--accent-fill-top), var(--btn-bg));
        box-shadow: var(--shadow-1), inset 0 1px 0 rgb(255 255 255 / 0.14), 0 0 0 1px color-mix(in srgb, var(--accent-fill) 60%, transparent);
      }
      .btn.primary:hover { --btn-bg: var(--accent-fill-hover); }
      .btn.danger { --btn-fg: var(--danger); }
      .btn.danger:hover { --btn-bg: var(--danger-soft); --btn-border: color-mix(in srgb, var(--danger) 35%, transparent); }
      .btn.danger-solid { --btn-bg: var(--danger-fill); --btn-fg: #fff; --btn-border: transparent; }
      .btn.danger-solid:hover { --btn-bg: color-mix(in srgb, var(--danger-fill) 88%, black); }
      .btn.ghost { --btn-bg: transparent; --btn-border: transparent; box-shadow: none; color: var(--text-2); }
      .btn.ghost:hover { --btn-bg: var(--surface-3); color: var(--text); }
      .btn.sm { height: var(--control-h-sm); padding: 0 10px; font-size: var(--fs-12); border-radius: var(--r-sm); gap: 5px; }
      .btn.lg { height: 42px; padding: 0 var(--sp-5); font-size: var(--fs-14); border-radius: 10px; }
      .btn.icon-only { width: var(--control-h); padding: 0; }
      .btn.sm.icon-only { width: var(--control-h-sm); }
      .btn.block { width: 100%; }
      .btn .spinner { width: 14px; height: 14px; }
      .btn[aria-busy="true"] > :not(.spinner) { opacity: 0.6; }
      .btn-group { display: inline-flex; gap: var(--sp-2); flex-wrap: wrap; }

      .spinner { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; opacity: 0.8; flex: none; }
      .spinner.sm { width: 12px; height: 12px; }
      .spinner.xs { width: 10px; height: 10px; border-width: 1.5px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- badges, chips, dots, counts ---------- */
      /* Tones come from [data-tone] (or an ancestor); components only supply fallbacks. */
      .badge {
        display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--r-full);
        background: var(--tone-soft, var(--surface-2)); color: var(--tone, var(--text-2)); font-size: var(--fs-12); font-weight: 550; white-space: nowrap; line-height: 1;
        border: 1px solid color-mix(in srgb, var(--tone, var(--text-2)) 14%, transparent);
      }
      .badge svg { width: 12px; height: 12px; }
      .badge.outline { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
      [data-tone="ok"] { --tone: var(--ok); --tone-soft: var(--ok-soft); }
      [data-tone="warn"] { --tone: var(--warn); --tone-soft: var(--warn-soft); }
      [data-tone="danger"] { --tone: var(--danger); --tone-soft: var(--danger-soft); }
      [data-tone="info"] { --tone: var(--info); --tone-soft: var(--info-soft); }
      [data-tone="accent"] { --tone: var(--accent); --tone-soft: var(--accent-soft); }
      [data-tone="agent"] { --tone: var(--agent); --tone-soft: var(--agent-soft); }
      [data-tone="neutral"] { --tone: var(--text-2); --tone-soft: var(--surface-2); }
      [data-tone="needs"] { --tone: var(--oxblood); --tone-soft: var(--oxblood-soft); }
      /* Words in their tone (an action class beside a tool's name). */
      .toned { color: var(--tone); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone, var(--text-3)); flex: none; display: inline-block; }
      .dot:not([data-tone]) { --tone: var(--text-3); }
      .dot.live { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone, var(--text-3)) 22%, transparent); }
      .count {
        display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-full);
        background: var(--accent-fill); color: var(--on-accent); font-size: 11px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums;
      }
      .count.quiet { background: var(--surface-3); color: var(--text-2); }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--sp-2); border-radius: var(--r-sm);
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: var(--fs-12); font-weight: 500; white-space: nowrap;
      }
      .chip svg { width: 13px; height: 13px; color: var(--text-3); }
      .chip.on { color: var(--text); }
      .chip.on svg { color: var(--ok); }
      button.chip { cursor: pointer; transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1), color var(--d-1); }
      button.chip:hover { border-color: var(--border-strong); color: var(--text); }
      button.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
      button.chip[aria-pressed="true"] svg { color: var(--accent); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-12); border: 1px solid var(--border); }
      button.tag { cursor: pointer; }
      button.tag:hover { color: var(--accent); border-color: var(--accent-border); }

      /* ---------- forms ---------- */
      .field { display: flex; flex-direction: column; gap: var(--field-gap); min-width: 0; }
      .field > label, .label { font-size: var(--fs-13); font-weight: 550; color: var(--text); }
      .field .hint { font-size: var(--fs-12); color: var(--text-3); }
      .field .error { font-size: var(--fs-12); color: var(--danger); }
      .fields { display: grid; gap: var(--form-gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
      .input, .select, .textarea {
        width: 100%; min-width: 0; height: var(--control-h); padding: 0 10px; border-radius: var(--r-md);
        border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--fs-input);
        box-shadow: var(--shadow-1); transition: border-color var(--d-1) var(--ease-out), box-shadow var(--d-1) var(--ease-out);
      }
      .textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
      /* A select as wide as its choices, beside other things (a tool's class). */
      .select.fit { width: auto; flex: none; }
      .select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
      .input::placeholder, .textarea::placeholder { color: var(--text-3); }
      .input:hover, .select:hover, .textarea:hover { border-color: color-mix(in srgb, var(--text-3) 60%, var(--border-strong)); }
      .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      .input:disabled, .select:disabled, .textarea:disabled { opacity: 0.55; cursor: not-allowed; }
      .input.mono { font-family: var(--font-mono); font-size: var(--fs-input-mono); }
      .input-wrap { position: relative; display: flex; align-items: center; }
      .input-wrap > svg { position: absolute; left: 10px; color: var(--text-3); pointer-events: none; }
      .input-wrap > .input { padding-left: 34px; }
      .secret-field { position: relative; }
      .secret-field .input { padding-left: 34px; letter-spacing: 0.08em; font-family: var(--font-mono); }
      .secret-field .input::placeholder { font-family: var(--font-sans); letter-spacing: normal; }
      /* A pasted key is never shown back, not even by the browser's own reveal button. */
      input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
      .secret-field > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); }

      .segmented {
        position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; isolation: isolate; max-width: 100%;
      }
      .segmented .thumb {
        position: absolute; z-index: -1; top: 2px; bottom: 2px; left: 0; border-radius: 8px; background: var(--surface);
        box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border); transition: transform var(--d-3) var(--ease-out), width var(--d-3) var(--ease-out);
      }
      .segmented button {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--control-h) - 6px); padding: 0 var(--sp-3);
        border: 0; background: none; border-radius: 8px; color: var(--text-2); font-size: var(--fs-13); font-weight: 550; white-space: nowrap;
        transition: color var(--d-1) var(--ease-out);
      }
      .segmented button:hover { color: var(--text); }
      .segmented button:disabled { color: var(--text-3); opacity: 0.6; cursor: not-allowed; }
      .segmented button[aria-checked="true"] { color: var(--text); }
      .segmented button[aria-checked="true"] svg { color: var(--seg-tone, var(--accent)); }
      .segmented.block { display: grid; width: 100%; }
      .segmented.sm button { height: calc(var(--control-h-sm) - 4px); font-size: var(--fs-12); padding: 0 10px; }

      .switch { position: relative; display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; min-height: 32px; }
      .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .switch-text { display: flex; flex-direction: column; min-width: 0; }
      .switch .track { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background-color var(--d-2) var(--ease-out), border-color var(--d-2); }
      .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: transform var(--d-2) var(--ease-out); }
      .switch input:checked + .track { background: var(--accent-fill); border-color: transparent; }
      .switch input:checked + .track::after { transform: translateX(14px); }
      .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
      .switch input:disabled + .track { opacity: 0.5; }

      .range { display: flex; flex-direction: column; gap: 6px; }
      .range .range-top { display: flex; justify-content: space-between; align-items: baseline; }
      .range output { font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--fs-13); }
      .range input[type="range"] { width: 100%; height: 24px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; --fill: 50%; }
      .range input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent-fill) var(--fill), var(--surface-3) var(--fill)); }
      .range input[type="range"]::-moz-range-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent-fill) var(--fill), var(--surface-3) var(--fill)); }
      .range input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
      .range input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
      .range input[type="range"]:focus-visible { outline: none; }
      .range input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); }
      .range .scale { display: flex; justify-content: space-between; font-size: var(--fs-11); color: var(--text-3); font-variant-numeric: tabular-nums; }

      .chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: var(--control-h); padding: 4px 6px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); cursor: text; }
      .chip-input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      .chip-input input { flex: 1; min-width: 100px; border: 0; outline: none; background: none; height: 24px; font-size: var(--fs-input); }
      .chip-input .tag button { border: 0; background: none; padding: 0 0 0 4px; color: var(--text-3); display: inline-flex; }
      .chip-input .tag button:hover { color: var(--danger); }

      /* ---------- callouts, states ---------- */
      .callout {
        display: flex; gap: 10px; align-items: flex-start; padding: var(--sp-3); border-radius: var(--r-md);
        background: var(--tone-soft, var(--info-soft)); border: 1px solid color-mix(in srgb, var(--tone, var(--info)) 18%, transparent); color: var(--text); font-size: var(--fs-13);
      }
      .callout > svg { color: var(--tone, var(--info)); margin-top: 1px; }
      .callout .callout-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
      .callout .callout-title { font-weight: 600; }
      .callout.quiet { background: var(--surface-2); border-color: var(--border); --tone: var(--text-3); }
      .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2); padding: var(--sp-10) var(--sp-4); color: var(--text-2); }
      .empty .empty-icon { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); margin-bottom: var(--sp-1); }
      .empty h3 { color: var(--text); font-size: var(--fs-15); }
      .empty p { max-width: 44ch; font-size: var(--fs-13); }
      .empty .btn-group { margin-top: var(--sp-2); justify-content: center; }
      .empty.compact { padding: var(--sp-6) var(--sp-4); }
      .skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r-sm); }
      .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, light-dark(rgb(255 255 255 / 0.6), rgb(255 255 255 / 0.04)), transparent); animation: shimmer 1.4s infinite; }
      :root[data-motion="reduce"] .skeleton::after { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .skeleton::after { animation: none; } }
      @keyframes shimmer { to { transform: translateX(100%); } }
      .sk-line { height: 12px; }
      .sk-avatar { flex: none; width: 28px; height: 28px; border-radius: var(--r-md); }
      .sk-block { border-radius: var(--r-lg); }
      .sk-row { display: flex; gap: var(--sp-3); align-items: center; padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); }
      .sk-row:first-child { border-top: 0; }

      /* ---------- stat tiles, meters ---------- */
      .stat { padding: var(--card-pad); display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out); }
      a.stat:hover { border-color: var(--border-strong); }
      .stat .stat-label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); font-weight: 550; color: var(--text-2); }
      .stat .stat-label svg { width: 14px; height: 14px; color: var(--text-3); }
      .stat .stat-value { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .stat .stat-value .of { color: var(--text-3); font-weight: 500; font-size: var(--fs-16); }
      .stat .stat-note { font-size: var(--fs-12); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
      /* On a phone the figures stay, smaller and tighter: the lists under them reach the first screen. */
      @media (max-width: 639px) {
        .grid.stats { gap: var(--sp-2); grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stat { padding: var(--sp-3); gap: 2px; }
        .stat .stat-value { font-size: var(--fs-20); }
        .stat .stat-value .of { font-size: var(--fs-14); }
        .stat .stat-note { line-height: 1.35; }
        .stat-skeleton { height: 86px; }
      }
      .stat-skeleton { height: 110px; border-radius: var(--r-lg); }
      .meter { position: relative; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
      .meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--tone, var(--accent-fill)); transform-origin: left; }
      .kv { display: grid; margin: 0; grid-template-columns: max-content 1fr; gap: 6px var(--sp-4); font-size: var(--fs-13); align-items: baseline; }
      .kv dt { color: var(--text-3); }
      .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

      /* ---------- copy fields, codes ---------- */
      .copyfield { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-sunken); overflow: hidden; }
      .copyfield code { flex: 1; min-width: 0; padding: 9px 12px; font: 13px/1.5 var(--font-mono); overflow-wrap: anywhere; user-select: all; }
      .copyfield .btn { border-radius: 0; border: 0; border-left: 1px solid var(--border-strong); height: auto; box-shadow: none; }
      .sas { display: flex; justify-content: center; gap: 6px; margin: var(--sp-2) 0; min-width: 0; }
      .sas span {
        display: grid; place-items: center; flex: 1 1 0; min-width: 0; max-width: 44px; aspect-ratio: 44 / 56; border-radius: 10px; background: var(--surface); border: 1px solid var(--accent-border);
        font: 650 clamp(20px, 6.5vw, 28px)/1 var(--font-mono); color: var(--accent); box-shadow: var(--shadow-1); font-variant-numeric: tabular-nums;
      }
      .sas span:nth-child(3) { margin-right: 8px; }
      /* A device code to type elsewhere (signing in to a provider): large, spaced. */
      .device-code { font-size: 1.4em; letter-spacing: 0.08em; }
      @media (max-width: 639px) { .solo-card .card { padding: var(--sp-5); } }
      .ring { --p: 1; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--accent-fill) calc(var(--p) * 360deg), var(--surface-3) 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); flex: none; }

      /* ---------- dialogs: centered on desktop, bottom sheet on phones ---------- */
      dialog.sheet {
        padding: 0; border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text);
        width: min(560px, calc(100vw - 32px)); max-height: min(86vh, 860px); box-shadow: var(--shadow-3); overflow: hidden;
        display: flex; flex-direction: column; opacity: 0; transform: translateY(8px) scale(0.98);
        transition: opacity var(--d-2) var(--ease-out), transform var(--d-2) var(--ease-out), overlay var(--d-2) allow-discrete, display var(--d-2) allow-discrete;
      }
      dialog.sheet:not([open]) { display: none; }
      dialog.sheet[open].shown { opacity: 1; transform: none; }
      dialog.sheet.wide { width: min(760px, calc(100vw - 32px)); }
      dialog.sheet.small { width: min(440px, calc(100vw - 32px)); }
      dialog.sheet::backdrop { background: var(--overlay); opacity: 0; transition: opacity var(--d-2) var(--ease-out); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
      dialog.sheet.shown::backdrop { opacity: 1; }
      .sheet-handle { display: none; }
      .sheet-head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-5) var(--sp-5) var(--sp-3); }
      .sheet-head h2 { font-size: var(--fs-18); font-weight: 650; letter-spacing: -0.015em; }
      .sheet-head .sub { color: var(--text-2); font-size: var(--fs-13); margin-top: 2px; }
      .sheet-body { padding: var(--sp-2) var(--sp-5) var(--sp-5); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: var(--form-gap); }
      .sheet-foot { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--border); background: var(--bg-sunken); flex-wrap: wrap; }
      @media (max-width: 639px) {
        /* A tray: inset from the screen's edges, every corner round, floating over the page. */
        dialog.sheet, dialog.sheet.wide, dialog.sheet.small {
          width: calc(100vw - 16px); max-width: calc(100vw - 16px); max-height: calc(100dvh - var(--safe-top) - 32px); margin: auto auto calc(8px + var(--safe-bottom)); border-radius: 32px;
          transform: translateY(calc(100% + 16px)); opacity: 1; transition: transform var(--d-sheet) var(--ease-drawer), overlay var(--d-sheet) allow-discrete, display var(--d-sheet) allow-discrete;
        }
        dialog.sheet[open].shown { transform: translateY(var(--drag, 0px)); }
        dialog.sheet.dragging { transition: none; }
        .sheet-handle { display: block; flex: none; height: 22px; touch-action: none; cursor: grab; position: relative; }
        .sheet-handle::after { content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 5px; margin-left: -18px; border-radius: 99px; background: var(--border-strong); }
        .sheet-head { padding-top: var(--sp-1); }
        .sheet-foot { border-top: 0; background: none; padding: var(--sp-1) var(--sp-4) var(--sp-4); }
        /* A sheet's buttons, in its foot or at the end of its form, thumb-sized and as wide as the sheet. */
        :is(.sheet-foot, dialog.sheet .form-actions) .btn { flex: 1; min-height: 48px; border-radius: var(--r-full); }
      }

      /* ---------- command palette ---------- */
      dialog.palette {
        margin: 12vh auto auto; padding: 0; width: min(620px, calc(100vw - 24px)); max-height: min(70vh, 560px, var(--room, 70vh));
        border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
        overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: scale(0.98);
        transition: opacity var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), overlay var(--d-1) allow-discrete, display var(--d-1) allow-discrete;
      }
      dialog.palette:not([open]) { display: none; }
      dialog.palette.shown { opacity: 1; transform: none; }
      dialog.palette::backdrop { background: var(--overlay); opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
      dialog.palette.shown::backdrop { opacity: 1; }
      /* Grown out of a button, it shapes itself (palette.ts). */
      dialog.palette[data-grow] { opacity: 1; transform: none; transition: none; }
      /* On a phone it is the top bar's search: its field lies on the bar's line, edge to edge with the bar's padding, over
         the search button at the bar's end (which grows into it). */
      @media (max-width: 639px) {
        dialog.palette { --field-h: 44px; margin-top: calc(var(--safe-top) + (var(--topbar-h) - var(--field-h)) / 2); width: calc(100vw - 2 * var(--sp-4)); max-width: none; max-height: min(70dvh, var(--room, 70dvh)); }
        dialog.palette .palette-input { height: var(--field-h); }
      }
      .palette-input { display: flex; flex: none; align-items: center; gap: 10px; padding: 0 var(--sp-4); height: 54px; border-bottom: 1px solid var(--border); }
      .palette-input input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: var(--fs-16); }
      /* The field is focused whenever the palette is open: an ink rule under it says so. */
      .palette-input:focus-within { box-shadow: inset 0 -2px 0 var(--focus); }
      .palette-input svg { color: var(--text-3); }
      .palette-input:focus-within svg { color: var(--text); }
      .palette-cancel {
        display: none; align-items: center; align-self: stretch; margin-right: calc(-1 * var(--sp-2)); padding: 0 var(--sp-2);
        border: 0; background: none; color: var(--text-2); font-size: var(--fs-15); font-weight: 500; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      }
      .palette-cancel:active { color: var(--text); }
      .palette-list { overflow-y: auto; padding: var(--sp-2); overscroll-behavior: contain; }
      .palette-group { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-2) var(--sp-2) var(--sp-1); }
      .palette-item { display: flex; align-items: center; gap: var(--sp-3); height: 40px; padding: 0 var(--sp-2) 0 10px; border-radius: var(--r-md); cursor: pointer; color: var(--text-2); }
      .palette-item svg { color: var(--text-3); }
      .palette-item .pl-label { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .palette-item .pl-label mark { background: none; color: var(--accent); font-weight: 650; }
      .palette-item .pl-hint { font-size: var(--fs-12); color: var(--text-3); }
      .palette-item[aria-selected="true"] { background: var(--surface-3); }
      .palette-item[aria-selected="true"] svg { color: var(--accent); }
      .palette-foot { display: flex; gap: var(--sp-4); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); color: var(--text-3); font-size: var(--fs-12); background: var(--bg-sunken); }
      .palette-foot span { display: inline-flex; align-items: center; gap: 4px; }
      @media (pointer: coarse) { .palette-foot, .palette-input kbd { display: none; } .palette-cancel { display: inline-flex; } .palette-item { height: 46px; } }

      /* ---------- smart selector: one control that says what's chosen, the choices in a popover (a sheet on phones) ---------- */
      .selector-trigger {
        display: inline-flex; align-items: center; gap: 6px; height: var(--control-h-sm); max-width: 100%; min-width: 0; padding: 0 8px 0 10px;
        border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); color: var(--text);
        font-size: var(--fs-13); font-weight: 550; white-space: nowrap; box-shadow: var(--shadow-1); user-select: none;
        transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out);
      }
      .selector-trigger:hover { background: var(--surface-2); }
      .selector-trigger:active { transform: scale(0.97); }
      .selector-trigger[aria-expanded="true"] { border-color: var(--focus); }
      /* Something other than the default is chosen (a filter is on): the owner's ink. */
      .selector-trigger[data-active="true"] { border-color: var(--accent-border); background: var(--accent-soft); }
      .selector-trigger.ghost { border-color: transparent; background: transparent; box-shadow: none; }
      .selector-trigger.ghost:hover { background: var(--surface-3); }
      .selector-trigger .sel-lead { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
      .selector-trigger .sel-current { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .selector-trigger .sel-chev { color: var(--text-3); margin-left: -1px; }
      dialog.selector-pop {
        position: fixed; inset: auto; margin: 0; padding: 0; width: 320px; max-height: 440px;
        border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
        overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: translateY(-4px) scale(0.98); transform-origin: top left;
        transition: opacity var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), overlay var(--d-1) allow-discrete, display var(--d-1) allow-discrete;
      }
      dialog.selector-pop.above { transform: translateY(4px) scale(0.98); transform-origin: bottom left; }
      dialog.selector-pop:not([open]) { display: none; }
      dialog.selector-pop.shown { opacity: 1; transform: none; }
      dialog.selector-pop::backdrop { background: transparent; }
      .sel-search { flex: none; display: flex; align-items: center; gap: var(--sp-2); height: 42px; padding: 0 var(--sp-3); border-bottom: 1px solid var(--border); color: var(--text-3); }
      .sel-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; font-size: var(--fs-input); }
      .sel-search input::placeholder { color: var(--text-3); }
      .sel-search:focus-within { box-shadow: inset 0 -2px 0 var(--focus); color: var(--text); }
      .sel-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-1); outline: none; }
      /* Keyboard focus sits on the list; the option it would choose carries the ring. */
      .sel-list:focus-visible { outline: none; }
      .sel-list:focus-visible .sel-option[data-active="true"] { box-shadow: inset 0 0 0 2px var(--focus); }
      .sel-group + .sel-group { margin-top: var(--sp-1); padding-top: var(--sp-1); border-top: 1px solid var(--border); }
      .sel-group-label { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-2) var(--sp-2) var(--sp-1); }
      .sel-option { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 5px var(--sp-2); border-radius: var(--r-md); cursor: pointer; color: var(--text-2); }
      .sel-option[data-active="true"] { background: var(--surface-3); }
      .sel-option > svg.icon { color: var(--text-3); }
      .sel-option[aria-selected="true"] > svg.icon, .sel-option[data-active="true"] > svg.icon { color: var(--accent); }
      .sel-option[aria-disabled="true"] { cursor: not-allowed; }
      .sel-option[aria-disabled="true"] .sel-label { color: var(--text-3); }
      .sel-option .sel-mark { flex: none; width: 15px; display: grid; place-items: center; color: var(--accent); }
      .sel-option .sel-box { flex: none; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; border: 1.5px solid var(--border-strong); background: var(--surface); }
      .sel-option[aria-selected="true"] .sel-box { background: var(--accent-fill); border-color: transparent; color: var(--on-accent); }
      .sel-option .sel-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
      .sel-option .sel-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-option[aria-selected="true"] .sel-label { font-weight: 550; }
      .sel-option .sel-label mark { background: none; color: var(--accent); font-weight: 650; }
      .sel-option .sel-meta { font-size: var(--fs-12); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-empty { padding: var(--sp-5) var(--sp-3); text-align: center; color: var(--text-3); font-size: var(--fs-13); }
      .sel-foot { flex: none; padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--border); background: var(--bg-sunken); font-size: var(--fs-12); color: var(--text-3); }
      /* On phones the same choices sit in a bottom sheet: the sheet scrolls, its rows are thumb-sized. */
      dialog.selector-sheet .sheet-body { gap: var(--sp-2); padding-left: var(--sp-3); padding-right: var(--sp-3); }
      dialog.selector-sheet .sel-search { height: var(--control-h); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); margin: 0 var(--sp-2); }
      dialog.selector-sheet .sel-search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      dialog.selector-sheet .sel-list { overflow: visible; padding: 0; }
      dialog.selector-sheet .sel-foot { margin: 0 var(--sp-2); border: 0; background: none; padding: var(--sp-1) 0 0; }
      @media (pointer: coarse) { .sel-option { min-height: 48px; } }

      /* ---------- toasts (stacked, newest in front) ---------- */
      .toaster { position: fixed; z-index: 1000; right: calc(var(--sp-4) + var(--safe-right)); bottom: calc(var(--sp-4) + var(--safe-bottom)); width: min(380px, calc(100vw - 32px)); pointer-events: none; }
      @media (max-width: 959px) { .toaster { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-3)); } }
      .toast {
        --i: 0; position: absolute; right: 0; bottom: 0; width: 100%; pointer-events: auto;
        display: flex; align-items: flex-start; gap: 10px; padding: var(--sp-3) var(--sp-3) var(--sp-3) 14px;
        background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-2);
        font-size: var(--fs-13); transform-origin: bottom center;
        transform: translateY(calc(var(--i) * -10px)) scale(calc(1 - var(--i) * 0.05)); opacity: calc(1 - var(--i) * 0.2);
        transition: transform var(--d-3) var(--ease-out), opacity var(--d-3) var(--ease-out);
      }
      .toast.entering { transform: translateY(110%); opacity: 0; }
      .toast.leaving { transform: translateY(40%); opacity: 0; transition-duration: var(--d-2); }
      .toast[data-hidden="true"] { opacity: 0; pointer-events: none; }
      .toaster:hover .toast, .toaster:focus-within .toast { transform: translateY(calc(var(--offset, 0px) * -1)); opacity: 1; }
      .toast > svg { margin-top: 1px; color: var(--tone, var(--text-2)); }
      .toast .toast-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .toast .toast-title { font-weight: 600; }
      .toast .toast-desc { color: var(--text-2); overflow-wrap: anywhere; }
      .toast .btn { flex: none; }

      /* ---------- markdown ---------- */
      .md { line-height: 1.65; overflow-wrap: anywhere; }
      .md > * + * { margin-top: 0.75em; }
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; margin-top: 1.1em; }
      .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; } .md h4, .md h5, .md h6 { font-size: 1em; }
      .md ul, .md ol { padding-left: 1.4em; margin-bottom: 0; }
      .md li + li { margin-top: 0.3em; }
      .md li > * + * { margin-top: 0.4em; }
      .md li::marker { color: var(--text-3); }
      .md blockquote { margin: 0; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--border-strong); color: var(--text-2); }
      .md hr { border: 0; height: 1px; background: var(--border); }
      .md code { font: 0.88em/1.4 var(--font-mono); padding: 0.12em 0.36em; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }
      .md a { overflow-wrap: anywhere; }
      .md .host { color: var(--text-3); font-size: 0.85em; margin-left: 2px; }
      .codeblock { position: relative; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-sunken); overflow: hidden; }
      .codeblock .cb-head { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-3); }
      .codeblock pre { margin: 0; padding: 12px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); tab-size: 2; }
      .codeblock pre code { background: none; border: 0; padding: 0; font: inherit; }
      .md .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
      .md table { border-collapse: collapse; width: 100%; font-size: 0.93em; }
      .md th, .md td { padding: 7px 10px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .md thead th { border-top: 0; background: var(--surface-2); font-weight: 600; }
      .md mark, mark.hl { background: color-mix(in srgb, var(--warn) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

      /* ---------- what an answer shows beyond words (ui/blocks.ts): a chart, figures, choices, steps, a page ---------- */
      /* The chart colours, in a fixed order, checked for colour-blind separation and contrast on each theme's surface. */
      :root { --viz-1: light-dark(#2a78d6, #3987e5); --viz-2: light-dark(#eb6834, #d95926); --viz-3: light-dark(#1baf7a, #199e70); --viz-4: light-dark(#eda100, #c98500); --viz-5: light-dark(#e87ba4, #d55181); --viz-6: #008300; }
      .viz, .viz-stats, .viz-steps, .viz-page, .viz-picture, .viz-pending, .viz-refused, .viz-choices { margin: var(--sp-3) 0; }
      .viz { position: relative; padding: 12px 12px 4px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); outline: none; }
      .viz:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
      .viz-head { display: flex; align-items: baseline; gap: var(--sp-2); margin-bottom: 6px; }
      .viz-title { font-weight: 600; font-size: var(--fs-14); }
      .viz-unit { font-size: var(--fs-12); color: var(--text-3); }
      .viz-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 4px; font-size: var(--fs-12); color: var(--text-2); }
      .viz-key { display: inline-flex; align-items: center; gap: 6px; }
      .viz-swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--key); }
      .viz-stroke { width: 12px; height: 2px; border-radius: 1px; background: var(--key); }
      .viz-stroke.blank { background: none; }
      .viz-plot { position: relative; }
      .viz-svg { display: block; width: 100%; height: auto; overflow: visible; }
      .viz-grid line { stroke: var(--border); stroke-width: 1; shape-rendering: crispEdges; }
      .viz-grid line.viz-zero { stroke: var(--border-strong); }
      .viz-tick { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
      .viz-value { font-size: 11px; fill: var(--text-2); font-weight: 600; }
      .viz-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .viz-wash { opacity: 0.1; stroke: none; }
      .viz-dot { stroke: var(--surface); stroke-width: 2; }
      .viz-band { fill: var(--surface-3); rx: 4px; }
      .viz-cross { stroke: var(--text-3); stroke-width: 1; shape-rendering: crispEdges; }
      .viz-hit { fill: transparent; cursor: crosshair; touch-action: pan-y; }
      .viz-tip {
        position: absolute; top: 4px; left: 0; z-index: 2; padding: 8px 10px; pointer-events: none; white-space: nowrap;
        border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-2); font-size: var(--fs-12); color: var(--text-2);
      }
      .viz-tip-row > span:last-child:not(.viz-stroke) { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
      .viz-tip-label { margin-bottom: 4px; color: var(--text-3); }
      .viz-tip-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
      .viz-tip-row strong { color: var(--text); font-variant-numeric: tabular-nums; }
      .viz-data { margin: 2px -4px 0; font-size: var(--fs-12); }
      .viz-data summary { cursor: pointer; padding: 6px 4px; color: var(--text-3); width: max-content; }
      .viz-data table { margin-bottom: 8px; font-variant-numeric: tabular-nums; }
      .viz-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--sp-2); }
      .viz-stat { padding: 12px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); min-width: 0; }
      .viz-stat-label { font-size: var(--fs-12); color: var(--text-2); }
      .viz-stat-value { margin-top: 2px; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
      .viz-stat-unit { margin-left: 4px; font-size: var(--fs-13); font-weight: 500; color: var(--text-3); letter-spacing: 0; }
      .viz-delta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin-top: 4px; font-size: var(--fs-12); font-weight: 600; color: var(--text-2); }
      .viz-delta.good { color: var(--ok); }
      .viz-delta.bad { color: var(--danger); }
      .viz-note { font-size: var(--fs-12); font-weight: 400; color: var(--text-3); }
      .viz-choices { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
      .viz-choice {
        min-height: 36px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: var(--r-full); background: var(--surface); color: var(--text);
        font-size: var(--fs-14); font-weight: 550; text-align: left; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        transition: background-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out);
      }
      button.viz-choice:hover { background: var(--surface-2); }
      button.viz-choice:active:not(:disabled) { transform: scale(0.97); }
      button.viz-choice:disabled { opacity: 0.5; }
      button.viz-choice[aria-pressed="true"] { opacity: 1; border-color: var(--text); }
      .viz-choice.static { color: var(--text-2); border-style: dashed; }
      @media (pointer: coarse) { .viz-choice { min-height: 44px; } }
      .viz-steps { list-style: none; padding: 0; display: grid; gap: 6px; }
      .viz-steps li { display: flex; align-items: flex-start; gap: 10px; }
      .viz-steps li > svg, .viz-todo { flex: none; margin-top: 3px; }
      .viz-todo { width: 16px; height: 16px; border: 1.5px solid var(--text-3); border-radius: 50%; }
      .viz-steps li[data-state="done"] { color: var(--text-2); }
      .viz-steps li[data-state="done"] > svg { color: var(--ok); }
      .viz-steps li[data-state="doing"] { font-weight: 600; }
      .viz-steps li[data-state="failed"] > svg { color: var(--danger); }
      .viz-steps li[data-state="skipped"] { color: var(--text-3); text-decoration: line-through; }
      .viz-page { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
      .viz-page-head { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--border); }
      .viz-page-head > strong { font-size: var(--fs-14); }
      .viz-frame { display: block; width: 100%; height: 320px; border: 0; background: #fff; }
      .viz-frame.tall { height: min(78dvh, 900px); border-radius: var(--r-md); }
      .viz-page .codeblock { border: 0; border-radius: 0; }
      .viz-page-note { margin: 0; padding: 8px 12px; border-top: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-3); }
      .viz-picture { display: grid; gap: 4px; justify-items: start; }
      .viz-picture img { max-width: 100%; max-height: 420px; border: 1px solid var(--border); border-radius: var(--r-md); background: #fff; }
      .viz-pending { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed var(--border-strong); border-radius: var(--r-lg); color: var(--text-3); font-size: var(--fs-13); }

      /* ---------- The Roundtable: a knight's (or a room's) timeline, its task cards, a knight's Workspace ---------- */
      .shell[data-route="team"] main.view { padding: 0; }
      .team-layout { display: flex; flex-direction: column; height: calc(100dvh - var(--topbar-h) - var(--tabbar-h) - var(--safe-bottom)); min-height: 320px; }
      .team-main { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
      .team-body { display: flex; flex: 1; min-height: 0; }
      .team-column { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
      /* A knight's side panel, beside its timeline from 1200 px (views/team.ts renderSide): the knight in its seat and what
         it is doing, its tasks, its workspace, its working notes. Shown unless hidden on this device; never on a phone. */
      .team-side, .btn.side-toggle { display: none; }
      @media (min-width: 1200px) {
        .team-side { display: flex; flex-direction: column; gap: var(--page-gap); flex: none; width: clamp(300px, 24vw, 380px); min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-5) var(--sp-5) var(--sp-8); border-left: 1px solid var(--border); }
        .btn.side-toggle { display: inline-flex; }
      }
      .team-head .side-toggle[aria-pressed="true"] { --btn-bg: var(--surface-3); color: var(--text); }
      .team-side-who { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); min-width: 0; }
      .team-side-who > .seat { margin-bottom: var(--sp-1); }
      .team-side-name { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
      .team-side-name h2 { min-width: 0; font-size: var(--fs-18); font-weight: 650; letter-spacing: -0.015em; }
      .team-side-line { color: var(--text-2); font-size: var(--fs-13); line-height: 1.5; overflow-wrap: anywhere; }
      .team-side-notes { color: var(--text-2); font-size: var(--fs-13); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
      .team-head-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .team-head-title h2 { min-width: 0; }
      .team-head { display: flex; align-items: center; gap: var(--sp-3); padding: calc(var(--safe-top) + var(--sp-4)) var(--sp-5) var(--sp-4); min-height: 78px; }
      .team-head:empty { display: none; }
      /* Its place held while the room is asked for (views/team.ts): a face, the name, the line under it. */
      .team-head-face { flex: none; width: 40px; height: 40px; border-radius: 50%; }
      .team-head > .seat { align-self: center; }
      .team-head-name { width: 120px; height: 18px; }
      .team-head-line { width: 200px; max-width: 100%; }
      .team-head h2 { font-size: var(--fs-16); font-weight: 650; letter-spacing: -0.015em; }
      .team-head > .btn { flex: none; }
      .team-content { min-height: 0; overflow: auto; overscroll-behavior: contain; flex: 1; }
      .team-panel { padding: var(--sp-6); max-width: 980px; margin: 0 auto; }
      .team-panel h3 { font-size: var(--fs-15); }
      .team-notice { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); background: var(--warn-soft); color: var(--warn); font-size: var(--fs-12); }
      .team-thread { display: flex; flex-direction: column; gap: var(--sp-5); padding: var(--sp-6); max-width: 880px; margin: 0 auto; }
      .team-message { display: flex; gap: var(--sp-3); min-width: 0; }
      .team-message-body { min-width: 0; flex: 1; overflow-wrap: anywhere; }
      .team-message-by { display: flex; align-items: baseline; gap: var(--sp-2); margin-bottom: 5px; font-size: var(--fs-12); }
      .team-message-by strong { font-weight: 650; }
      .team-message-by time { color: var(--text-3); font-size: var(--fs-11); }
      .team-message.owner { margin-left: 44px; align-self: flex-end; max-width: 88%; }
      .team-message.owner .team-message-by { justify-content: flex-end; }
      .team-owner-text { padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
      .team-system { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; padding-left: 44px; color: var(--text-3); font-size: var(--fs-12); overflow-wrap: anywhere; }
      .team-system > svg { align-self: center; }
      .team-composer { padding: var(--sp-2) var(--sp-6) var(--sp-5); width: 100%; max-width: 880px; margin: 0 auto; flex: none; }
      .team-composer .composer { box-shadow: var(--shadow-1); }
      .team-composer textarea { max-height: 160px; }
      .team-live { display: flex; flex-wrap: wrap; gap: var(--sp-3); min-height: 0; margin-bottom: var(--sp-2); color: var(--text-3); font-size: var(--fs-12); }
      .team-live:empty, .team-send-error:empty { display: none; }
      .team-send-error { margin-bottom: var(--sp-2); }
      /* The Roundtable's own page on a wide screen (views/board.ts): everyone at the table as a board of cards, or a list,
         in your order, who leads first; then the rooms. A card is its knight's portrait in its seat (live eyes, its
         state's ring), its name and job, its state in a word, and what it is doing now, two lines at most. */
      .roundtable-home { max-width: 1440px; padding: var(--sp-6) var(--sp-8) var(--sp-12); }
      .roundtable-body { position: relative; display: flex; flex-direction: column; gap: var(--page-gap); min-width: 0; }
      .board { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); }
      .knight-card { position: relative; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-5) var(--card-pad) var(--card-pad); color: inherit; text-decoration: none; transition: border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out); }
      a.knight-card:hover { border-color: var(--border-strong); }
      a.knight-card:active { transform: scale(0.99); }
      .knight-card-portrait { display: grid; place-items: center; }
      /* Who leads wears its mark in the card's corner, clear of its portrait's ring. */
      .knight-card > .lead-mark { position: absolute; top: var(--sp-3); left: var(--sp-3); }
      .knight-card-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .knight-card-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .knight-card-head h3 { min-width: 0; font-size: var(--fs-15); font-weight: 650; }
      .knight-card-head > .state-chip { margin-left: auto; flex: none; }
      .knight-card-role { color: var(--text-3); font-size: var(--fs-12); }
      .knight-card-line { margin-top: var(--sp-1); min-height: calc(2 * 1.45 * var(--fs-13)); color: var(--text-2); font-size: var(--fs-13); line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .knight-card-arrange { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-1); margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--border); }
      .knight-card-add { align-items: center; justify-content: center; gap: var(--sp-2); min-height: 248px; border-style: dashed; box-shadow: none; background: none; color: var(--text-2); font: inherit; font-weight: 500; cursor: pointer; }
      .knight-card-add:hover { border-color: var(--border-strong); color: var(--text); }
      .knight-card-plus { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
      .knight-row-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .team-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--sp-4); }
      .team-fieldset { border: 0; padding: 0; margin: 0; }
      .team-fieldset legend { font-size: var(--fs-13); font-weight: 600; margin-bottom: var(--sp-2); }
      .team-member-choices, .team-dependency-choices { display: flex; flex-direction: column; gap: var(--sp-2); max-height: 240px; overflow: auto; }
      .team-member-choice { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-md); }
      .team-member-choice .meta { display: block; }
      /* A task is a card in the timeline: where it stands; while it runs, its latest lines; once it has ended, how. */
      .team-task { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--card-pad); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1); }
      .task-head { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
      .task-head strong { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
      .task-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-12); }
      /* Its latest six lines (TAIL, views/task-card.ts), in a box that is six lines tall from the start: lines arriving fill it, they don't grow the card. */
      .task-trail { display: flex; flex-direction: column; gap: 2px; min-height: calc(6 * 1.55 * var(--fs-12) + 5 * 2px + 2 * var(--sp-2)); padding: var(--sp-2) var(--sp-3); background: var(--bg-sunken); border-radius: var(--r-md); font: var(--fs-12)/1.55 var(--font-mono); color: var(--text-2); }
      .task-trail-line { display: flex; gap: 1ch; min-width: 0; white-space: nowrap; }
      .task-trail-line > .ellipsis { min-width: 0; }
      .task-trail-line:last-child { color: var(--text); }
      .task-said { color: var(--text-2); font-size: var(--fs-13); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
      .task-kept { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--fs-12); color: var(--text-2); }
      .task-kept a { color: var(--accent); }
      .task-foot { display: flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap; margin-top: 2px; }
      .team-task-details > summary { color: var(--text-2); font-size: var(--fs-12); cursor: pointer; padding: 3px 0; }
      .team-task-details[open] > summary { margin-bottom: var(--sp-3); }
      .team-output { max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; padding: var(--sp-3); background: var(--bg-sunken); border-radius: var(--r-md); font: var(--fs-12)/1.6 var(--font-mono); }
      /* A knight's desktop in its Workspace: its screen as a picture (a click on it clicks there), then the ways to take it over. */
      .desktop h3 { font-size: var(--fs-15); }
      .desktop-shot { aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-sunken); }
      .desktop-shot img { display: block; width: 100%; height: 100%; cursor: crosshair; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .desktop-shot img:not([data-shown]) { visibility: hidden; }
      .desktop-line { display: flex; align-items: center; gap: var(--sp-2); }
      .desktop-line .input { flex: 1; min-width: 0; }
      .desktop-slot:empty { display: none; }
      /* A task given to the Roundtable: who took it and why, then how each of the others stood. */
      .give-choice { display: flex; align-items: center; gap: var(--sp-3); }
      .give-choice h3 { font-size: var(--fs-18); font-weight: 650; letter-spacing: -0.015em; }
      .roster-label > .btn:not(.icon-only):not(.primary) { color: var(--text-2); }
      .team-person-summary { display: flex; align-items: flex-start; gap: var(--sp-3); }
      .team-workspace-empty { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-5); border: 1px dashed var(--border-strong); border-radius: var(--r-lg); }
      @media (min-width: 960px) { .team-layout { height: calc(100dvh - var(--topbar-h)); } }
      @media (max-width: 719px) {
        .team-head { padding: calc(var(--safe-top) + var(--sp-3)) var(--sp-3) var(--sp-3); gap: var(--sp-2); min-height: 70px; }
        .team-head > .badge { display: none; }
        .team-head > .avatar { display: none; }
        .team-thread, .team-panel { padding: var(--sp-4); }
        .team-composer { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
        .team-composer .hint { font-size: var(--fs-11); }
        .team-message.owner { margin-left: 30px; }
        .team-head .workspace-toggle { width: var(--control-h-sm); padding: 0; }
        .team-head .workspace-toggle > span { display: none; }
      }
      .team-head .workspace-toggle[aria-pressed="true"] { --btn-bg: var(--surface-3); }
      :root[data-keyboard="open"] .team-layout { height: calc(100dvh - var(--topbar-h)); }
      @media (pointer: coarse) { .team-member-choice, .team-task-details > summary { min-height: 44px; } }
      /* A knight in its seat (ui/avatar.ts seat()): its face in a ring of its state's colour (lib/knight-state.ts), the
         ring just outside the drawing's reach. A hairline at rest; an arc of ink that turns while it works; Galahad's
         oxblood, calling softly, while it waits on you; red for a failure; green for work just verified; grey while
         queued; dashed while paused. The turning and the calling stop when the device asks for less motion. */
      .seat {
        --ring: var(--border-strong); --ring-w: 1px; --seat-pad: 4px;
        position: relative; display: inline-grid; place-items: center; flex: none; padding: var(--seat-pad); border-radius: 50%; background: var(--surface-2);
      }
      .seat.seat-m { --seat-pad: 7px; }
      .seat.seat-l { --seat-pad: 9px; }
      .seat::before { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 var(--ring-w) var(--ring); pointer-events: none; }
      .seat:not([data-state="resting"]) { --ring-w: 2px; }
      .seat.seat-m:not([data-state="resting"]) { --ring-w: 2.5px; }
      .seat.seat-l:not([data-state="resting"]) { --ring-w: 3px; }
      /* Every state's ring stands still (the owner's word: nothing at the table spins or pulses): its colour says it. */
      .seat[data-state="working"] { --ring: var(--accent); }
      .seat[data-state="needs"] { --ring: var(--oxblood); }
      .seat[data-state="failed"] { --ring: var(--danger); }
      .seat[data-state="verified"] { --ring: var(--ok); }
      .seat[data-state="queued"] { --ring: var(--text-3); }
      .seat[data-state="paused"]::before { box-shadow: none; border: var(--ring-w) dashed var(--text-3); }
      /* A state in words in a badge (ui/avatar.ts stateChip(), a chat's, a quest's, a loop's): working's carries a still dot. */
      .badge .dot { width: 6px; height: 6px; }
      /* The one who leads the Roundtable (ui/avatar.ts leadMark()): beside its name, small, in ink, in words. */
      .lead-mark {
        display: inline-flex; align-items: center; flex: none; height: 18px; padding: 0 6px; border-radius: var(--r-full); border: 1px solid var(--accent-border);
        color: var(--text); font-size: var(--fs-11); font-weight: 600; line-height: 1; letter-spacing: 0.01em; white-space: nowrap;
      }
      /* The knights' faces (ui/avatar.ts): drawn whole in SVG and never moving. Galahad's own is in ink, whatever the theme. */
      .worker-avatar { display: block; flex: none; }
      .worker-avatar[data-galahad] { color: var(--accent); }
      .worker-avatar[data-galahad] .worker-avatar-ink { color: var(--on-accent); }
      .avatar-editor { min-width: 0; margin: 0; padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: var(--sp-4); }
      .avatar-editor legend { padding: 0 6px; color: var(--text-2); font-size: var(--fs-13); font-weight: 600; }
      .avatar-editor-stage { display: flex; align-items: center; gap: var(--sp-4); }
      .avatar-editor-stage > .stack { flex: 1; min-width: 0; }
      .avatar-editor-preview { width: 148px; height: 148px; display: grid; place-items: center; flex: none; border-radius: 24px; background: radial-gradient(ellipse at 50% 35%, var(--surface-3), var(--surface)); }
      @media (max-width: 719px) {
        .team-head > .worker-avatar { width: 32px; height: 32px; }
        .avatar-editor-stage { flex-direction: column; text-align: center; }
        .avatar-editor-stage > .stack { width: 100%; }
      }
      /* ---------- end Team workspace ---------- */

      /* ---------- chat ---------- */
      .chat { display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; min-height: calc(100dvh - var(--tabbar-h) - var(--safe-bottom)); }
      @media (min-width: 960px) { .chat { min-height: 100dvh; } }
      /* The chat's header is Galahad himself, and on this page it takes the top bar's place: his face and what he's
         doing now in a line (a tap shows what he has in hand), then your chats, a new one, and the chat's one menu. */
      .shell[data-route="chat"] main.view { padding-top: 0; }
      .shell[data-route="chat"] .main-col { overflow-x: clip; }
      .chat-head { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: var(--sp-2); min-width: 0; padding: calc(var(--safe-top) + 6px) 0 6px; margin-bottom: var(--sp-3); }
      /* (Its ground runs the page's whole width, as the top bar's does, whatever the column's.) */
      .chat-head::before { content: ""; position: absolute; z-index: -1; inset: 0 -100vw; background: var(--bg); }
      .chat-head > .btn, .chat-head > .selector-trigger { flex: none; }
      .chat-inbox { position: relative; }
      .chat-inbox .count { position: absolute; top: -4px; right: -4px; }
      .chat-who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 2px 8px 2px 2px; margin-left: -2px; border: 0; border-radius: var(--r-md); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .chat-who:hover { background: var(--surface-2); }
      .chat-who-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
      .chat-name { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-weight: 650; letter-spacing: -0.01em; }
      .chat-as { font-weight: 400; font-size: var(--fs-12); letter-spacing: 0; color: var(--text-3); }
      .chat-now { font-size: var(--fs-12); color: var(--tone, var(--text-2)); }
      /* The chat's title, or that it's temporary, or its place while it's opened: one height whichever it is. */
      .chat-sub { display: flex; align-items: center; gap: var(--sp-2); margin-top: calc(-1 * var(--sp-1)); padding-bottom: var(--sp-3); min-width: 0; min-height: calc(var(--fs-body) * 1.5 + 4px + var(--sp-3)); }
      .chat-sub-pending { width: 180px; }
      .chat-sub:empty { display: none; }
      .chat-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font: inherit; font-weight: 600; color: var(--text); background: none; border: 0; cursor: pointer; padding: 2px 6px; margin-left: -6px; border-radius: var(--r-sm); max-width: min(100%, 520px); }
      .selector-trigger.icon-only { width: var(--control-h-sm); padding: 0; justify-content: center; flex: none; }
      .selector-trigger.icon-only .sel-current, .selector-trigger.icon-only .sel-chev { display: none; }
      .selector-trigger.icon-only .sel-lead { color: inherit; }
      .chat-title:hover { background: var(--surface-2); }
      .chat-row { font: inherit; text-align: left; width: 100%; background: none; border: 0; cursor: pointer; color: inherit; }
      .chat-row:hover, .chat-row[aria-current="true"] { background: var(--surface-2); }
      .recent-chats { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: min(100%, 520px); margin: var(--sp-6) auto 0; text-align: left; }
      .card-link { font: inherit; text-align: left; color: inherit; cursor: pointer; }
      .card-link:hover { border-color: var(--border-strong); }
      .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .thread { flex: 1; display: flex; flex-direction: column; gap: var(--sp-6); padding-bottom: var(--sp-6); }
      .turn { display: flex; gap: var(--sp-3); min-width: 0; }
      .turn.user { justify-content: flex-end; }
      .turn.user .bubble { max-width: min(88%, 620px); background: var(--surface-2); border: 1px solid var(--border); padding: 9px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .turn.assistant .turn-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
      .turn .avatar { margin-top: 1px; }
      .turn-actions { display: flex; gap: 2px; min-height: 28px; }
      @media (hover: hover) {
        .turn .turn-actions { opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
        .turn:hover .turn-actions, .turn:focus-within .turn-actions, .turn.last .turn-actions { opacity: 1; }
      }
      .turn.user .turn-actions { justify-content: flex-end; }
      .turn-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 0; }
      /* What a message of yours carried: pictures to tap open, texts by name. */
      .attached { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: min(88%, 620px); }
      .attached-picture { padding: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface-2); width: 132px; height: 132px; cursor: zoom-in; }
      .attached-picture img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .attached-picture.gone { cursor: default; }
      .attached-file { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); font-size: var(--fs-13); }

      @keyframes blink { to { visibility: hidden; } }
      .process { display: flex; flex-direction: column; gap: 0; font-size: var(--fs-12); color: var(--text-2); min-width: 0; }
      .process summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; color: var(--text-3); width: fit-content; max-width: 100%; min-width: 0; border-radius: var(--r-sm); padding: 2px 6px 2px 2px; }

      .step:not(:last-child)::before { content: ""; position: absolute; left: 7.5px; top: 17px; bottom: 0; width: 1px; background: var(--border); }
      .step .step-mark { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); }

      /* The composer sticks to the bottom; on the chat page main drops its extra bottom space so the

      .composer-wrap { position: sticky; bottom: calc(var(--tabbar-h) + var(--safe-bottom)); padding: var(--sp-2) 0 var(--sp-3); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
      .shell[data-route="chat"] main.view { padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom)); }

      /* The on-screen keyboard is up (iOS keeps the page full height under it): the tab bar steps aside

      @media (max-width: 639px) {

      }
      .composer { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-2); transition: border-color var(--d-1) var(--ease-out), box-shadow var(--d-1) var(--ease-out); }
      .composer:focus-within { border-color: color-mix(in srgb, var(--focus) 60%, var(--border-strong)); box-shadow: var(--shadow-2), 0 0 0 3px color-mix(in srgb, var(--focus) 14%, transparent); }
      .composer textarea { display: block; width: 100%; border: 0; outline: none; background: none; resize: none; padding: 12px 14px 4px; max-height: 40vh; min-height: 48px; line-height: 1.5; font-size: var(--fs-input); }

      .composer-file { display: flex; align-items: center; gap: 8px; flex: none; max-width: 220px; padding: 4px 2px 4px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
      .composer-file.failed { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }

      /* "Latest", over the composer, when the thread is scrolled up (views/chat.ts). */

      /* What's waiting while he works: steers on their way, the queue (held or not), and what unattended work may do. */
      .chat-queue { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-2); font-size: var(--fs-13); min-width: 0; }

      .place-rank { display: flex; flex-direction: column; gap: var(--sp-2); }

      .place-row.first { border-color: var(--accent-border); background: var(--accent-soft); }

      /* A card that opens on request: one line (with what it's about) until it's wanted. */

      .net-explain > svg { color: var(--tone); margin-top: 1px; }
      .console { display: flex; flex-direction: column; border: 1px solid var(--border-strong); border-radius: var(--r-lg); overflow: hidden; background: #060607; color: #e4e4e8; }
      .console .console-out { min-height: 160px; max-height: 50vh; overflow: auto; padding: var(--sp-3); font: 12.5px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }

      .console .console-in { display: flex; align-items: center; gap: var(--sp-2); border-top: 1px solid #1f1f23; padding: 6px 6px 6px 12px; background: #0d0d0f; }

      .console .console-in input { flex: 1; min-width: 0; height: 32px; border: 0; outline: none; background: none; color: #ededef; font: var(--fs-input-mono) var(--font-mono); }
      .console .console-in input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
      .console .console-in .btn { --btn-bg: #17171a; --btn-fg: #ededef; --btn-border: #2e2e33; }

      /* ---------- welcome / pairing ---------- */
      .solo { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(var(--sp-6) + var(--safe-top)) var(--sp-4) calc(var(--sp-6) + var(--safe-bottom)); background: radial-gradient(1200px 600px at 50% -10%, var(--glow), transparent 60%), var(--bg); }
      .solo-card { width: min(460px, 100%); display: flex; flex-direction: column; gap: var(--sp-5); animation: page-in var(--d-3) var(--ease-out); }
      .solo-card .card { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4); }
      .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2); }
      /* The emblem in a breath of starlight (welcome, pairing, an empty chat). */
      .hero-mark { position: relative; display: grid; place-items: center; margin-bottom: var(--sp-3); }
      .hero-mark::before { content: ""; position: absolute; inset: -70%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-hero), transparent); pointer-events: none; }
      .hero-mark .emblem { position: relative; animation: emblem-in var(--d-sheet) var(--ease-out); }
      @keyframes emblem-in { from { opacity: 0; transform: translateY(4px) scale(0.97); } }
      .hero h1 { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.022em; }
      .hero p { color: var(--text-2); max-width: 40ch; }
      .steps-num { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-3); counter-reset: s; }
      .steps-num li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: var(--sp-3); align-items: start; font-size: var(--fs-13); color: var(--text-2); }
      .steps-num li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-12); font-weight: 600; color: var(--text); }
      .steps-num li > div { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; min-width: 0; }
      .solo-foot { text-align: center; font-size: var(--fs-12); color: var(--text-3); display: flex; flex-direction: column; gap: 4px; align-items: center; }
      .trust-strip { display: flex; gap: var(--sp-4); justify-content: center; flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-12); }
      .trust-strip span { display: inline-flex; gap: 6px; align-items: center; }
      .trust-strip svg { width: 14px; height: 14px; }

      /* ---------- misc ---------- */
      /* The app's own icon, in About. */
      .about-icon { flex: none; border-radius: 10px; }
      .scope-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: var(--sp-2); }
      /* An invite's QR code: white paper whatever the theme (a camera needs the contrast), big enough to scan across a desk. */
      .invite-qr { align-self: center; width: min(240px, 72vw); aspect-ratio: 1; padding: 0; border-radius: var(--r-md); background: #fff; box-shadow: var(--shadow-1); overflow: hidden; }
      .invite-qr svg { display: block; width: 100%; height: 100%; }
      .scope { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); font-size: var(--fs-13); }
      .scope svg { margin-top: 2px; }
      label.scope { cursor: pointer; }
      .scope.on svg { color: var(--ok); }
      .scope.off { background: transparent; border-style: dashed; color: var(--text-3); }
      .scope .scope-name { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text); }
      .scope.off .scope-name { color: var(--text-3); }
      .autonomy { display: flex; flex-direction: column; }
      .autonomy .a-row { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-3); align-items: center; padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); font-size: var(--fs-13); }
      .autonomy .a-row:first-child { border-top: 0; }
      .help-list { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-13); align-items: center; }
      .help-list .keys { display: flex; gap: 3px; justify-content: flex-end; }
      .reorder { display: flex; flex-direction: column; gap: 6px; }
      .reorder .r-item { display: flex; align-items: center; gap: var(--sp-2); padding: 4px 4px 4px 10px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
      .reorder .r-item .r-index { font: 600 11px var(--font-mono); color: var(--text-3); width: 16px; }
      .reorder .r-item:first-child { border-color: var(--accent-border); }
      .reorder .r-item:first-child .r-index { color: var(--accent); }
      /* Words Galahad (or an agent) wrote, shown as a quotation: data, never instructions. */
      .quote { padding: 2px 0 2px 12px; border-left: 2px solid var(--border-strong); color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
      /* A tool's answer or a receipt: verbatim, scrollable, never parsed. */
      /* A kept picture, previewed: never wider than its sheet, on sunken ground (a transparent one shows its edges). */
      .preview-img { max-width: 100%; height: auto; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--bg-sunken); }
      /* Long text in a box of its own height that scrolls (an archived entry's description). */
      .scroll-box { max-height: 420px; overflow: auto; }
      .result { margin: 0; padding: 10px 12px; max-height: 50vh; overflow: auto; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-md); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--font-mono); color: var(--text); }
      .notice-strip { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-12); color: var(--text-3); }
      .notice-strip svg { width: 14px; height: 14px; }
      .flow { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-12); color: var(--text-2); }
      .flow .node-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
      .flow .node-pill svg { width: 14px; height: 14px; }
      .flow .arrow { color: var(--text-3); }
      .flow .blocked { color: var(--danger); text-decoration: line-through; text-decoration-thickness: 1px; }
      @media (max-width: 639px) {
        .flow { flex-direction: column; align-items: flex-start; gap: 2px; }
        .flow .arrow { transform: rotate(90deg); margin-left: 14px; line-height: 1; }
      }
      @media print { .sidebar, .tabbar, .topbar, .toaster { display: none !important; } }

      /* ---------- his skills: each a page of notes ---------- */
      .skills-budget { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-12); }
      .skill-page { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
      .card.skill-page { padding: var(--sp-5) var(--sp-6); }

      .skill-head h3 { font-size: var(--fs-18); font-weight: 600; letter-spacing: -0.014em; line-height: 1.3; overflow-wrap: anywhere; }
      .skill-head .meta, .skill-origin .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); color: var(--text-3); font-size: var(--fs-12); }
      .skill-origin { display: flex; flex-direction: column; gap: 6px; }
      .skill-origin > p:first-child { line-height: 1.55; overflow-wrap: anywhere; max-width: 68ch; }
      .skill-head:not(:has(h3)) { padding-bottom: var(--sp-3); }
      .skill-part { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
      .skill-part h4 { font-size: var(--fs-13); font-weight: 600; color: var(--text-2); letter-spacing: 0.01em; }
      .skill-part > p, .skill-part li { line-height: 1.6; overflow-wrap: anywhere; max-width: 68ch; }
      .skill-part ol, .skill-part ul { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: var(--sp-2); }
      .skill-part ul.skill-proof, .skill-part ul.skill-record { list-style: none; padding-left: 0; }
      .skill-proof code { display: block; font: 12px/1.5 var(--font-mono); background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-md); padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .skill-proof .expect { color: var(--text-2); font-size: var(--fs-13); margin-top: 4px; }
      /* A command is read character by character: "=>" stays two characters, never a ligature. */
      .skill-proof code, #skill-proof { font-variant-ligatures: none; }
      .skill-record li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); font-size: var(--fs-13); color: var(--text-2); max-width: none; }
      .skill-record li .grow { flex: 1 1 12ch; min-width: 0; color: var(--text); }
      .skill-record li .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); color: var(--text-3); font-size: var(--fs-12); }
      .skill-waiting { padding-top: var(--sp-4); border-top: 1px solid var(--border); }
      .skill-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--border); }
      .skill-foot .grow { flex: 1 1 auto; }
      .skill-row-title { font-weight: 550; }
      .skill-row-when { font-size: var(--fs-13); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      @media (max-width: 639px) { .card.skill-page { padding: var(--sp-4); } .skill-head h3 { font-size: var(--fs-16); } .skill-record li.skill-version .grow { flex-basis: 100%; } }
