# Galahad's native Apple apps: a SwiftUI client for a Galahad node, for iPhone and iPad, and for the Mac (docs/MAC.md),
# both from the same sources (what is one platform's alone is marked `#if os(iOS)` or `#if os(macOS)` in them).
# XcodeGen writes Galahad.xcodeproj and each app's Info.plist from this file; none of them is committed (README.md).
name: Galahad
options:
  bundleIdPrefix: org.amirite
  deploymentTarget:
    iOS: "26.0"
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Sparkle 2, for the Mac app's updates (the owner's choice: docs/MAC.md), at an exact release: 2.10.1, of 25 October 2026.
# Its framework is a binary Swift Package Manager checks against the checksum in that release's Package.swift.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Galahad:
    type: application
    platform: iOS
    sources:
      - path: Galahad
        excludes: ["Mac/**"]
      # The knights as the owner drew them: the PWA's own files, bundled as they are (never copied, redrawn or recoloured).
      - path: ../web/src/knights
        type: folder
        buildPhase: resources
    info:
      path: Galahad/Info.plist
      properties:
        CFBundleDisplayName: Galahad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A node on this machine or the local network answers over plain HTTP; everywhere else ATS holds.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    # Notifications from your node, through Apple's push service (written by XcodeGen like Info.plist). Xcode builds
    # answer to Apple's development service; an archive for TestFlight is signed for its production one.
    entitlements:
      path: Galahad/Galahad.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.amirite.galahad
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  GalahadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GalahadTests
    dependencies:
      - target: Galahad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.amirite.galahad.tests
  # The Mac's: a native app (not Mac Catalyst), the client and the node's manager. It is called Galahad as the iPhone's is,
  # and its module is too, so the tests import it as they import the iPhone's. A build here is signed to run on this Mac
  # only and carries no node: scripts/mac-node-bundle.sh puts the node in a built app and signs it, with the Developer ID
  # for a release (docs/MAC.md, M2).
  GalahadMac:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      # The iPhone's Info.plist and entitlements are XcodeGen's, written there for the iOS target.
      - path: Galahad
        excludes: ["Info.plist", "Galahad.entitlements"]
      - path: ../web/src/knights
        type: folder
        buildPhase: resources
    info:
      path: GalahadMac/Info.plist
      properties:
        CFBundleDisplayName: Galahad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A `galahad:` link carrying an invite opens the app at joining, with the invite filled in.
        CFBundleURLTypes:
          - CFBundleURLName: org.amirite.galahad.invite
            CFBundleURLSchemes: [galahad]
        # Updates (Sparkle): the signed feed, and the public key each update is checked against. The key is the owner's to
        # make (Sparkle's generate_keys, its private half kept in their keychain); until it is set, the updater stays off.
        SUFeedURL: https://galahad.sh/mac/appcast.xml
        SUPublicEDKey: $(GALAHAD_SPARKLE_PUBLIC_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.amirite.galahad.mac
        PRODUCT_NAME: Galahad
        # Sparkle's public EdDSA key (base64), empty until the owner has made it.
        GALAHAD_SPARKLE_PUBLIC_KEY: ""
        PRODUCT_MODULE_NAME: Galahad
        ASSETCATALOG_COMPILER_APPICON_NAME: MacIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: YES
      # A release lets no debugger in (Xcode adds get-task-allow even to a Release build signed to run locally), which
      # notarization requires: mac-node-bundle.sh refuses a Developer ID signing of a build that does.
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  GalahadMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GalahadTests
    dependencies:
      - target: GalahadMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.amirite.galahad.mac.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Galahad.app/Contents/MacOS/Galahad
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Galahad:
    build:
      targets:
        Galahad: all
        GalahadTests: [test]
    test:
      targets:
        - GalahadTests
  GalahadMac:
    build:
      targets:
        GalahadMac: all
        GalahadMacTests: [test]
    test:
      targets:
        - GalahadMacTests
