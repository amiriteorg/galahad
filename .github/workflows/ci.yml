# CI, run by both forges from this one file. Galahad's main copy is on sovware.io (Forgejo, sign-in only, no
# sign-ups), whose Actions run it on the owner's runner for every push and pull request there: only the owner and
# their agents can push there. GitHub is sovware.io's public push mirror and runs it on its own runners for every
# push the mirror makes, and for pull requests on GitHub. A pull request from a fork runs its own copy of a workflow,
# so no job asks for a runner of the owner's by name: on GitHub a stranger's code must never reach the owner's
# machines (the organisation's runner group refuses public repositories as well, and is left that way). The site
# deploys from whichever run holds CLOUDFLARE_API_TOKEN: GitHub's (sovware.io holds no such secret, so it skips).
#
#  typecheck  ┐
#  test       │ every push and PR
#  bench      │ the scorecard's quality gates (bun run bench --ci, docs/BENCHMARKS.md)
#  site-gate  ┘
#  sandbox    real-Docker sandbox tests; opt-in via the repo variable SANDBOX_TESTS=true (GitHub's runner
#             has Docker and no KVM: the microVM cases are skipped there)
#  site       on main, after everything passes: deploy galahad.sh (and galahad.bot) when CLOUDFLARE_API_TOKEN exists
#
# Hardening: read-only token, actions pinned to commit SHAs, no pull_request_target,
# credentials not persisted in the checkout, superseded runs cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
        if: github.server_url == 'https://github.com'
        env:
          GALAHAD_KEYSTORE: file
      # sovware.io's runner runs a job's steps as root in its container, and Galahad never runs as root: its installer
      # refuses to, and its terminals' tests act as a person's shell does. There the tests run as a user of their own.
      - name: bun test (as a user of its own, not root)
        if: github.server_url != 'https://github.com'
        run: |
          install -m 755 "$(command -v bun)" /usr/local/bin/bun
          id ci >/dev/null 2>&1 || useradd --create-home --uid 1001 ci
          chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && GALAHAD_KEYSTORE=file bun test"

  # The scorecard: every suite's deterministic quality metrics against the recorded baselines (bench/baseline/).
  # A metric that got worse, one the baseline had that's gone, a suite that broke or has no baseline: red.
  # Timings are printed and never fail here: a runner isn't the machine the baseline was taken on.
  bench:
    name: Scorecard (quality gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run bench --ci
        if: github.server_url == 'https://github.com'
        env:
          GALAHAD_KEYSTORE: file
      # Its web suite measures the app in Chrome. GitHub's runners have one; sovware.io's runner image doesn't, so it
      # fetches one there, and runs the scorecard as a user of its own (Chrome, as Galahad, won't run as root), with
      # Chrome's sandbox off, which a container can't make: it loads nothing but this checkout's own app.
      - name: Chrome (sovware.io's runner has none)
        id: chrome
        if: github.server_url != 'https://github.com'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
          no-sudo: true
      - name: bun run bench --ci (as a user of its own, not root)
        if: github.server_url != 'https://github.com'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          install -m 755 "$(command -v bun)" /usr/local/bin/bun
          id ci >/dev/null 2>&1 || useradd --create-home --uid 1001 ci
          chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && GALAHAD_KEYSTORE=file GALAHAD_CHROME_NO_SANDBOX=1 CHROME='$CHROME_PATH' bun run bench --ci"

  site-gate:
    name: Site gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Astro builds on Node (22.23 or later), which a runner may not have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: apps/site
      # Build the site, then check what it would serve (scripts/check.ts).
      - run: bun run check
        working-directory: apps/site

  sandbox:
    name: Sandbox (real Docker)
    needs: [typecheck, test]
    if: vars.SANDBOX_TESTS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: docker build -q -t galahad/sandbox:1 sandbox/
      - run: bun test packages/sandbox
        env:
          GALAHAD_DOCKER_TESTS: "1"

  site:
    name: Deploy galahad.sh
    needs: [typecheck, test, bench, site-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Astro and wrangler run on Node (22.23 or later), which a runner may not have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The site is its own project, with its own lockfile: a Galahad install never brings its tools.
      - run: bun install --frozen-lockfile
        working-directory: apps/site
      - name: Deploy (skipped until the CLOUDFLARE_API_TOKEN secret is set)
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the site deploy."
            exit 0
          fi
          bun run check
          ./node_modules/.bin/wrangler deploy
