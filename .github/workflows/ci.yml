# CI on GitHub's own runners: independent jobs run in parallel. Galahad's repository is public, and a
# pull request from a fork runs its own copy of a workflow, so no job here asks for a runner of the
# owner's: a stranger's code must never reach the owner's machines (the organisation's runner group
# refuses public repositories as well, and is left that way). GitHub's runners are free for a public
# repository.
#
#  typecheck  ┐
#  test       │ every push and PR
#  bench      │ the scorecard's quality gates (bun run bench --ci, docs/BENCHMARKS.md)
#  site-gate  ┘
#  sandbox    real-Docker sandbox tests; opt-in via the repo variable SANDBOX_TESTS=true (GitHub's runner
#             has Docker and no KVM: the microVM cases are skipped there)
#  site       on main, after everything passes: deploy galahad.bot (when CLOUDFLARE_API_TOKEN exists)
#
# Hardening: read-only token, actions pinned to commit SHAs, no pull_request_target,
# credentials not persisted in the checkout, superseded runs cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          GALAHAD_KEYSTORE: file

  # The scorecard: every suite's deterministic quality metrics against the recorded baselines (bench/baseline/).
  # A metric that got worse, one the baseline had that's gone, a suite that broke or has no baseline: red.
  # Timings are printed and never fail here: a runner isn't the machine the baseline was taken on.
  bench:
    name: Scorecard (quality gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run bench --ci
        env:
          GALAHAD_KEYSTORE: file

  site-gate:
    name: Site gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun apps/site/scripts/check.ts

  sandbox:
    name: Sandbox (real Docker)
    needs: [typecheck, test]
    if: vars.SANDBOX_TESTS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: docker build -q -t galahad/sandbox:1 sandbox/
      - run: bun test packages/sandbox
        env:
          GALAHAD_DOCKER_TESTS: "1"

  site:
    name: Deploy galahad.bot
    needs: [typecheck, test, bench, site-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # wrangler runs on Node (22 or later), which a runner may not have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The site is its own project, with its own lockfile: a Galahad install never brings its tools.
      - run: bun install --frozen-lockfile
        working-directory: apps/site
      - name: Deploy (skipped until the CLOUDFLARE_API_TOKEN secret is set)
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the site deploy."
            exit 0
          fi
          bun scripts/check.ts
          ./node_modules/.bin/wrangler deploy
